name: Build axel
on: [push, pull_request]

jobs:
  build_axel:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@v6

    - name: Setup Cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        packages: make gcc-g++ autoconf automake libtool pkg-config autoconf-archive gettext gettext-devel libssl-devel wget

    - name: Fix gettext archive.dir.tar.xz bug
      shell: C:\tools\cygwin\bin\bash.exe --login {0}
      run: |
        mkdir -p /usr/share/gettext
        touch /usr/share/gettext/archive.dir.tar.xz

    - name: Install txt2man
      shell: C:\tools\cygwin\bin\bash.exe --login {0}
      run: |
        wget https://github.com/mvertes/txt2man/archive/refs/tags/txt2man-1.7.1.tar.gz
        tar -zxvf txt2man-1.7.1.tar.gz
        cd txt2man-txt2man-1.7.1
        install -m 755 txt2man /usr/bin

    - name: Build axel
      shell: C:\tools\cygwin\bin\bash.exe --login {0}
      run: |
        cd "${GITHUB_WORKSPACE}"
        autoreconf -ifv
        ./configure LIBS=-lintl --disable-nls --disable-Werror
        make -j$(nproc)

    - name: Upload
      uses: actions/upload-artifact@v5
      with:
        name: axel
        path: |
          ${{ github.workspace }}/src/*.exe

    - name: Package Release
      run: 7z a axel.7z "${{ github.workspace }}\src\*.exe"

    - name: Release
      if: startsWith(github.event.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2.4.2
      with:
        draft: false
        prerelease: false
        files: axel.7z
