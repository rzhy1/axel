name: Build axel (MSYS2)
on: [push, pull_request]

jobs:
  build_axel_msys2:
    permissions:
      contents: write
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Disable git autocrlf
      shell: bash
      run: git config --global core.autocrlf false

    - uses: actions/checkout@v4
    
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        # 移除了 wget，因为不需要下载 txt2man 了
        install: >-
          git
          base-devel
          autotools
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-gettext
          mingw-w64-ucrt-x86_64-pkg-config

    # ✨ 优化点：不再下载安装 txt2man，而是创建一个“假”命令
    # 这样 configure 会找到它，make 执行它时也不会报错（虽然生成的文档是空的，但无所谓）
    - name: Mock txt2man (Skip docs)
      run: |
        echo '#!/bin/sh' > /usr/bin/txt2man
        echo 'true' >> /usr/bin/txt2man
        chmod +x /usr/bin/txt2man

    - name: Build axel
      run: |
        cd "${{ github.workspace }}"
        autoreconf -ifv
        ./configure \
          --prefix=$MINGW_PREFIX \
          --disable-nls \
          --disable-Werror
        make

    - name: Bundle Dependencies (DLLs)
      run: |
        cd "${{ github.workspace }}"
        mkdir -p dist
        cp axel.exe dist/
        
        echo "Searching for dependencies..."
        # 自动提取依赖 DLL
        ldd axel.exe | grep "$MINGW_PREFIX" | awk '{print $3}' | xargs -I '{}' cp '{}' dist/
        
        echo "Bundled content:"
        ls -l dist/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-msys2-dist
        path: dist/*

    - name: Package Release
      shell: cmd
      run: 7z a axel.7z .\dist\*
      
    - name: Release
      if: startsWith(github.event.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: false
        files: axel.7z
