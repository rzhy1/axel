name: Build Axel (Windows Static no NLS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build Axel for Windows (x64 Static)
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-upx
          autoconf
          automake
          libtool
          make
          pkgconf
          git
          curl
          wget
          autoconf-archive

    - name: Clone Axel
      shell: msys2 {0}
      run: |
        git clone https://github.com/axel-download-accelerator/axel.git axel-src
        cd axel-src
        rm -rf po
        echo "Axel source ready"

    - name: Apply Windows Patches (Full Static + Fixes)
      shell: msys2 {0}
      run: |
        cd axel-src

        cat <<'EOF' > patch_axel.py
        #!/usr/bin/env python3
        import re, os, sys
        def read(f):  return open(f, 'r', encoding='utf-8').read()
        def write(f, c): open(f, 'w', encoding='utf-8', newline='\n').write(c); print(f"Patched {f}")

        # 1. axel.h - Windows 兼容头
        h = read('src/axel.h')
        win_header = """
        #if defined(_WIN32)
        #ifndef _WIN32_WINNT
        #define _WIN32_WINNT 0x0600
        #endif
        #include <winsock2.h>
        #include <ws2tcpip.h>
        #include <windows.h>
        typedef SOCKET axel_socket_t;
        typedef HANDLE axel_thread_t;
        #define SHUT_RDWR SD_BOTH
        #undef min
        #undef max
        #else
        typedef int axel_socket_t;
        typedef pthread_t axel_thread_t;
        #endif
        """
        if '#include <stdio.h>' in h:
            h = h.replace('#include <stdio.h>', win_header + '\n#include <stdio.h>')
        else:
            h = win_header + '\n' + h
        for hdr in ['netinet/in.h','netinet/ip.h','arpa/inet.h','sys/socket.h','unistd.h']:
            h = h.replace(f'#include <{hdr}>', f'#ifndef _WIN32\n#include <{hdr}>\n#endif')
        write('src/axel.h', h)

        # 2. tcp.h - 使用 axel_socket_t
        h = read('src/tcp.h')
        h = re.sub(r'int\s+fd;', 'axel_socket_t fd;', h)
        write('src/tcp.h', h)

        # 3. tcp.c - 完整 Windows 原生实现（推荐方式）
        tcp_c = """
        #include "axel.h"
        #ifdef _WIN32
        #include <ws2tcpip.h>

        int tcp_connect(tcp_t *tcp, char *hostname, int port, int secure, char *local_if, unsigned io_timeout)
        {
            struct addrinfo hints = {0}, *res, *r;
            char portstr[16];
            SOCKET s = INVALID_SOCKET;

            hints.ai_family = AF_UNSPEC;
            hints.ai_socktype = SOCK_STREAM;
            snprintf(portstr, sizeof(portstr), "%d", port);

            if (getaddrinfo(hostname, portstr, &hints, &res) != 0)
                return -1;

            for (r = res; r; r = r->ai_next) {
                s = socket(r->ai_family, r->ai_socktype, r->ai_protocol);
                if (s == INVALID_SOCKET) continue;

                u_long mode = 1;
                ioctlsocket(s, FIONBIO, &mode);

                if (connect(s, r->ai_addr, (int)r->ai_addrlen) == 0 ||
                    (WSAGetLastError() == WSAEWOULDBLOCK && 
                     select(0, NULL, &(fd_set){{ .fd_count = 1, .fd_array = {s} }}, NULL,
                            &(struct timeval){ .tv_sec = io_timeout }) > 0)) {
                    int err = 0; int len = sizeof(err);
                    getsockopt(s, SOL_SOCKET, SO_ERROR, (char*)&err, &len);
                    if (err == 0) break;
                }
                closesocket(s);
                s = INVALID_SOCKET;
            }
            freeaddrinfo(res);
            if (s == INVALID_SOCKET) return -1;

            u_long mode = 0;
            ioctlsocket(s, FIONBIO, &mode);
            DWORD tv = io_timeout * 1000;
            setsockopt(s, SOL_SOCKET, SO_RCVTIMEO, (char*)&tv, sizeof(tv));
            setsockopt(s, SOL_SOCKET, SO_SNDTIMEO, (char*)&tv, sizeof(tv));

            tcp->fd = s;
        #ifdef HAVE_SSL
            if (secure) {
                BIO *bio = BIO_new_socket((int)s, BIO_CLOSE);
                tcp->ssl = SSL_new(ssl_ctx_global);
                SSL_set_bio(tcp->ssl, bio, bio);
                SSL_set_tlsext_host_name(tcp->ssl, hostname);
                if (SSL_connect(tcp->ssl) <= 0) {
                    ssl_disconnect(tcp->ssl);
                    tcp->ssl = NULL;
                    closesocket(s);
                    return -1;
                }
            }
        #endif
            return 0;
        }

        void tcp_close(tcp_t *tcp) {
            if (tcp->fd == INVALID_SOCKET) return;
        #ifdef HAVE_SSL
            if (tcp->ssl) ssl_disconnect(tcp->ssl);
        #endif
            closesocket(tcp->fd);
            tcp->fd = INVALID_SOCKET;
        }
        ssize_t tcp_read(tcp_t *tcp, void *buf, int size) {
        #ifdef HAVE_SSL
            if (tcp->ssl) return SSL_read(tcp->ssl, buf, size);
        #endif
            return recv(tcp->fd, buf, size, 0);
        }
        ssize_t tcp_write(tcp_t *tcp, void *buf, int size) {
        #ifdef HAVE_SSL
            if (tcp->ssl) return SSL_write(tcp->ssl, buf, size);
        #endif
            return send(tcp->fd, buf, size, 0);
        }
        #else
        /* 原 Unix 实现保持不变 */
        #include "../src/tcp.c"
        #endif
        """
        write('src/tcp.c', tcp_c)

        # 4. ssl.c - 简化并使用全局 CTX + BIO 方式
        ssl_c = """
        #include "axel.h"
        #include <openssl/ssl.h>
        #include <openssl/err.h>

        SSL_CTX *ssl_ctx_global = NULL;

        void ssl_init(conf_t *conf) {
            (void)conf;
            if (ssl_ctx_global) return;
            SSL_library_init();
            SSL_load_error_strings();
            ssl_ctx_global = SSL_CTX_new(TLS_client_method());
            SSL_CTX_set_verify(ssl_ctx_global, SSL_VERIFY_NONE, NULL);
            SSL_CTX_set_options(ssl_ctx_global, SSL_OP_ALL | SSL_OP_NO_SSLv2 | SSL_OP_NO_SSLv3);
        }

        SSL *ssl_connect(int fd, char *hostname) { return NULL; }  /* 已迁移到 tcp.c */
        void ssl_disconnect(SSL *ssl) {
            if (ssl) {
                SSL_shutdown(ssl);
                SSL_free(ssl);
            }
        }
        """
        write('src/ssl.c', ssl_c)

        # 5. main 中加入 Winsock 初始化与清理
        main_c = read('src/text.c')
        if 'WSACleanup();' not in main_c:
            init = """
        #ifdef _WIN32
            WSADATA wsa;
            if (WSAStartup(MAKEWORD(2,2), &wsa) != 0) {
                fprintf(stderr, "WSAStartup failed\\n");
                return 1;
            }
        #endif
            """
            main_c = re.sub(r'(int\s+main\s*\([^)]*\)\s*\{)', r'\\1' + init, main_c, count=1)

            cleanup = """
        #ifdef _WIN32
            WSACleanup();
        #endif
            """
            main_c = re.sub(r'(^\s*return\s+\d+;\s*$)', cleanup + '\n\\1', main_c, flags=re.M)
        write('src/text.c', main_c)

        print("All Windows patches applied")
        EOF

        python3 patch_axel.py

        # 修改 configure.ac 和 Makefile.am
        sed -i '/AM_GNU_GETTEXT/d' configure.ac
        sed -i 's|po/Makefile.in po||g' configure.ac
        sed -i '/AM_INIT_AUTOMAKE/a LT_INIT' configure.ac

        mkdir -p m4
        cat > Makefile.am <<'EOF'
        AUTOMAKE_OPTIONS = foreign
        ACLOCAL_AMFLAGS = -I m4
        SUBDIRS = src
        EXTRA_DIST = README.md
        EOF

        mkdir -p src
        echo "bin_PROGRAMS = axel" > src/Makefile.am
        echo "axel_SOURCES = $(ls src/*.c | tr '\\n' ' ')" >> src/Makefile.am
        echo "axel_LDFLAGS = -all-static" >> src/Makefile.am
        echo "axel_LDADD = -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lz -lbcrypt" >> src/Makefile.am

        autoreconf -fi

    - name: Configure & Build (Full Static)
      shell: msys2 {0}
      run: |
        cd axel-src
        export PKG_CONFIG="pkgconf --static"
        export CFLAGS="-O3 -march=x86-64-v3 -flto=auto -pipe -D_FORTIFY_SOURCE=2 -fstack-protector-strong"
        export LDFLAGS="-static -static-libgcc -static-libstdc++"

        ./configure \
          --host=x86_64-w64-mingw32 \
          --disable-nls \
          --disable-shared \
          --with-ssl=openssl

        make -j$(nproc)

        strip axel.exe
        upx --best --lzma axel.exe

        echo "Final binary:"
        ls -lh axel.exe

        # 验证完全静态
        if ldd axel.exe 2>/dev/null | grep -i dll; then
          echo "Still has DLL dependencies!"
          exit 1
        else
          echo "100% static, no DLL dependencies"
        fi

        ./axel.exe --version

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-x64-static
        path: axel-src/axel.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: axel-windows-x64-static
          path: .

      - name: Get version from tag
        run: echo "AXEL_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref }}
          name: Axel ${{ env.AXEL_VERSION }} (Windows Static x64)
          body: |
            Static Windows 64-bit build (no DLLs required)
            - Full HTTPS support
            - Based on upstream + Windows native socket fixes
            - UPX compressed (~1.3 MB)
          artifacts: axel.exe
          token: ${{ secrets.GITHUB_TOKEN }}
