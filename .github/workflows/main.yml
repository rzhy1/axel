name: Build axel
on: [push, pull_request]

jobs:
  build_axel:
    permissions:
      contents: write
    runs-on: windows-latest
    
    steps:
    - name: Disable git autocrlf
      run: git config --global core.autocrlf false

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        # 添加了 gawk 以确保 txt2man 正常工作
        packages: >
          make gcc-g++ autoconf automake libtool pkg-config 
          autoconf-archive gettext gettext-devel libssl-devel 
          wget gawk

    - name: Setup txt2man
      shell: bash --login --noprofile --norc -euxo pipefail -o igncr -i '{0}'
      run: |
        wget https://github.com/mvertes/txt2man/archive/refs/tags/txt2man-1.7.1.tar.gz
        tar -zxvf txt2man-1.7.1.tar.gz
        cd txt2man-txt2man-1.7.1
        chmod +x txt2man
        cp txt2man /usr/bin/

    - name: Build axel
      shell: bash --login --noprofile --norc -euxo pipefail -o igncr -i '{0}'
      run: |
        cd "${{ github.workspace }}"
        autoreconf -ifv
        # 使用 --prefix=/usr 确保安装路径正常，虽然这里不执行 make install
        ./configure LIBS=-lintl --disable-nls --disable-Werror --prefix=/usr
        make

    - name: Bundle DLL dependencies
      shell: bash --login --noprofile --norc -euxo pipefail -o igncr -i '{0}'
      run: |
        cd "${{ github.workspace }}"
        # 创建一个发布文件夹
        mkdir -p dist
        cp axel.exe dist/
        
        # === 关键步骤：自动查找并复制依赖的 DLL ===
        echo "Finding dependencies..."
        exe="./dist/axel.exe"
        # 使用 ldd 找出所有依赖，过滤出 /usr/bin 下的 dll，并复制到 dist 目录
        ldd "$exe" | grep '/usr/bin/' | awk '{print $3}' | xargs -I '{}' cp '{}' dist/
        
        echo "Bundled files:"
        ls -l dist/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-build
        path: dist/*

    - name: Package Release
      # 此时所有文件都在 dist 文件夹里
      run: 7z a axel.7z -r dist\*
      
    - name: Release
      if: startsWith(github.event.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: false
        files: axel.7z
