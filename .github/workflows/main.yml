name: Build Axel (Windows Static, Stable)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git mingw-w64 automake libtool gettext autopoint \
          pkg-config make autoconf autoconf-archive txt2man wget

    # -------------------------------
    # 1. 构建 OpenSSL（稳定配置）
    # -------------------------------
    - name: Build OpenSSL (static, safe)
      run: |
        wget -q https://github.com/openssl/openssl/releases/download/openssl-3.2.1/openssl-3.2.1.tar.gz
        tar xzf openssl-3.2.1.tar.gz
        cd openssl-3.2.1

        ./Configure mingw64 \
          --cross-compile-prefix=x86_64-w64-mingw32- \
          no-shared no-tests no-apps no-docs \
          --prefix=$PWD/../openssl-mingw

        make -j$(nproc)
        make install_sw

    # -------------------------------
    # 2. 获取 Axel
    # -------------------------------
    - name: Clone Axel
      run: |
        git clone https://github.com/axel-download-accelerator/axel.git
        cd axel
        git submodule update --init --recursive

    # -------------------------------
    # 3. 最小 Windows 兼容补丁
    # -------------------------------
    - name: Apply minimal Windows fixes
      run: |
        cd axel

        cat > winfix.patch << 'EOF'
        diff --git a/src/axel.c b/src/axel.c
        index 1111111..2222222 100644
        --- a/src/axel.c
        +++ b/src/axel.c
        @@
        +#ifdef _WIN32
        +#include <winsock2.h>
        +#endif
        +
        +static void axel_win_init(void)
        +{
        +#ifdef _WIN32
        +    static int initialized = 0;
        +    if (!initialized) {
        +        WSADATA wsa;
        +        WSAStartup(MAKEWORD(2,2), &wsa);
        +        initialized = 1;
        +    }
        +#endif
        +}
        +
         axel_t *axel_new(void)
         {
        +    axel_win_init();
        EOF

        patch -p1 < winfix.patch || true

        # ssize_t 兼容
        sed -i '1i #ifdef _WIN32\n typedef long long ssize_t;\n #endif' src/axel.h

        # fcntl -> ioctlsocket（仅替换非阻塞）
        sed -i 's/fcntl(\(.*\), F_SETFL, O_NONBLOCK)/{u_long m=1;ioctlsocket(\1,FIONBIO,\&m);}/g' src/tcp.c

    # -------------------------------
    # 4. 生成 configure
    # -------------------------------
    - name: Generate configure
      run: |
        cd axel
        autoreconf -fi

    # -------------------------------
    # 5. 编译 Axel
    # -------------------------------
    - name: Build Axel (static)
      run: |
        cd axel

        export PKG_CONFIG_PATH=$(pwd)/../openssl-mingw/lib/pkgconfig

        export CC=x86_64-w64-mingw32-gcc
        export CFLAGS="-O2 -static -D_WIN32_WINNT=0x0601"
        export LDFLAGS="-static -static-libgcc"

        ./configure \
          --host=x86_64-w64-mingw32 \
          --with-ssl=openssl \
          --disable-nls \
          LIBS="-lws2_32 -lcrypt32"

        make -j$(nproc)

    # -------------------------------
    # 6. Strip
    # -------------------------------
    - name: Strip binary
      run: |
        cd axel
        x86_64-w64-mingw32-strip axel.exe

    # -------------------------------
    # 7. 上传
    # -------------------------------
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-static-stable
        path: axel/axel.exe
