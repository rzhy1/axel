name: Build Axel (Windows Static no NLS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build Axel for Windows (x64 Static)
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-openssl
          autoconf
          automake
          libtool
          make
          pkgconf
          git
          autoconf-archive
          python

    - name: Clone Axel
      run: |
        git clone https://github.com/axel-download-accelerator/axel.git axel-src
        cd axel-src
        rm -rf po

    - name: Apply Windows Patches (Final Fix)
      run: |
        cd axel-src

        # 1. 彻底删除所有会导致 configure 报错的 POSIX 检查
        sed -i '/AC_CHECK_HEADERS(\[ \\$/,/AC_MSG_ERROR.*required/d' configure.ac

        # 2. 删除 gettext + po 相关
        sed -i '/AM_GNU_GETTEXT/d' configure.ac
        sed -i '/po\/Makefile\.in/d' configure.ac

        # 3. 修复 AC_CONFIG_FILES（关键！避免语法错误）
        sed -i '/AC_CONFIG_FILES/,$d' configure.ac
        cat >> configure.ac <<'EOF'

        AC_CONFIG_FILES([Makefile src/Makefile])
        AC_OUTPUT
        EOF

        # 4. 在 mingw 分支添加宏，骗过所有检查
        sed -i '/\[*mingw32\], \[/a\
            AC_DEFINE([HAVE_ARPA_INET_H], [1], [Fake for Windows])\
            AC_DEFINE([HAVE_NETINET_IN_H], [1], [Fake])\
            AC_DEFINE([HAVE_SYS_SOCKET_H], [1], [Fake])\
            AC_DEFINE([HAVE_UNISTD_H], [1], [Fake])\
            AC_DEFINE([HAVE_NANOSLEEP], [1], [Fake])' configure.ac

        # 5. 必须的 LT_INIT
        sed -i '/AM_INIT_AUTOMAKE/a LT_INIT' configure.ac
        mkdir -p m4

        # 6. 条件化头文件（防止编译错误）
        for h in arpa/inet.h netinet/in.h sys/socket.h unistd.h sys/ioctl.h netdb.h; do
          find src -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
            "s|#include <${h}>|#ifndef _WIN32\n#include <${h}>\n#endif|g" {} \+
        done

        # 7. Winsock 初始化（最稳方式）
        sed -i '/int main(/a\
        #ifdef _WIN32\
        WSADATA wsaData;\
        if (WSAStartup(MAKEWORD(2,2), &wsaData) != 0) {\
            fprintf(stderr, "WSAStartup failed\\n");\
            return 1;\
        }\
        #endif' src/text.c

        sed -i '/return /i\
        #ifdef _WIN32\
        WSACleanup();\
        #endif' src/text.c

        # 8. 强制纯静态 Makefile.am
        cat > Makefile.am <<'EOF'
        AUTOMAKE_OPTIONS = foreign
        ACLOCAL_AMFLAGS = -I m4
        SUBDIRS = src
        EOF

        cat > src/Makefile.am <<'EOF'
        bin_PROGRAMS = axel
        axel_SOURCES = $(wildcard *.c)
        axel_CFLAGS = -DWIN32 -DHAVE_SSL
        axel_LDFLAGS = -all-static
        axel_LDADD = -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lz
        EOF

        autoreconf -fi

    - name: Configure for Static Build
      run: |
        cd axel-src
        export PKG_CONFIG="pkgconf --static"
        export LDFLAGS="-static -static-libgcc -static-libstdc++"
        ./configure --host=x86_64-w64-mingw32 --with-ssl=openssl --disable-nls

    - name: Build and Strip
      run: |
        cd axel-src
        make -j$(nproc)
        strip axel.exe
        upx --best --lzma axel.exe || echo "upx failed, skip"
        
        echo "Build success!"
        ls -lh axel.exe
        file axel.exe
        ldd axel.exe 2>/dev/null || echo "Not a dynamic executable - 纯静态成功！"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-static
        path: axel-src/axel.exe
        retention-days: 7
