name: Build axel
on: [push, pull_request]
jobs:
  build_axel:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
    
    - name: Set up Cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        packages: make gcc-g++ autoconf automake libtool pkg-config autoconf-archive gettext gettext-devel libssl-devel wget
        
    - name: Setup txt2man
      shell: bash --login --noprofile --norc -euxo pipefail -o igncr -i '{0}'
      run: |
        wget https://github.com/mvertes/txt2man/archive/refs/tags/txt2man-1.7.1.tar.gz
        tar -zxvf txt2man-1.7.1.tar.gz
        cd txt2man-txt2man-1.7.1
        make
        cp txt2man /usr/local/bin/
        
    - name: Build axel
      shell: bash --login --noprofile --norc -euxo pipefail -o igncr -i '{0}'
      run: |
        cd "$(cygpath -u '${{ github.workspace }}')"
        autoreconf -ifv
        ./configure LIBS=-lintl --disable-nls --disable-Werror
        make
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: axel
        path: |
          ${{ github.workspace }}/*.exe
          
    - name: Package Release
      if: startsWith(github.event.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $exeFiles = Get-ChildItem -Path "${{ github.workspace }}" -Filter "*.exe"
        if ($exeFiles) {
          Compress-Archive -Path $exeFiles -DestinationPath "axel.zip" -Force
        }
      
    - name: Release
      if: startsWith(github.event.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2.4.2
      with:
        draft: false
        prerelease: false
        files: axel.zip
