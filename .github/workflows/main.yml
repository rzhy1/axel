name: Build Axel (Windows Static) with HTTPS Support

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          mingw-w64 \
          automake \
          libtool \
          gettext \
          autopoint \
          pkg-config \
          make \
          autoconf-archive \
          txt2man

    - name: Build and Install Autoconf 2.72
      run: |
        wget https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
        tar -xf autoconf-2.72.tar.xz
        cd autoconf-2.72
        ./configure --prefix=/usr/local
        make -j$(nproc)
        sudo make install
        autoconf --version

    - name: Clone axel source
      run: |
        git clone https://github.com/axel-download-accelerator/axel.git
        cd axel
        git submodule update --init --recursive

    - name: Create and run comprehensive fix script
      run: |
        cd axel
        cat > fix-axel.sh << 'ENDOFSCRIPT'
        #!/bin/bash
        set -e
        
        echo "Applying Windows compatibility fixes..."
        
        # ========== 1. src/axel.h: Windows 兼容性修复 ==========
        echo "Patching src/axel.h..."
        
        # 添加 Windows 支持（带保护宏）
        sed -i '/^#include <sys\/time.h>/a\
\
/* Windows/MinGW compatibility */\
#ifdef __MINGW32__\
#include <stdint.h>\
#include <ws2tcpip.h>\
#include <winsock2.h>\
#ifndef sa_family_t\
#define sa_family_t ADDRESS_FAMILY\
#endif\
#ifndef AF_INET\
#define AF_INET 2\
#endif\
#ifndef AF_INET6\
#define AF_INET6 23\
#endif\
#ifndef AF_UNSPEC\
#define AF_UNSPEC 0\
#endif\
#ifndef _SSIZE_T_DEFINED\
#ifndef _SSIZE_T_\
#ifndef __ssize_t_defined\
typedef intptr_t ssize_t;\
#define _SSIZE_T_DEFINED\
#define _SSIZE_T_\
#define __ssize_t_defined\
#endif\
#endif\
#endif\
#endif' src/axel.h
        
        # 注释掉 Linux 特有头文件
        sed -i 's|^#include <net/if.h>|/* #include <net/if.h> */|' src/axel.h
        
        # 处理 min/max 宏冲突
        sed -i '/^#include "search.h"/a\
\
#ifdef min\
#undef min\
#endif\
#ifdef max\
#undef max\
#endif' src/axel.h
        
        # ========== 2. 格式化字符串修复: %jd -> %lld ==========
        echo "Fixing format strings..."
        sed -i 's/%jd bytes/%lld bytes/g' src/axel.c
        sed -i 's/%jd-%jd/%lld-%lld/g' src/http.c
        sed -i 's/%jd-/%lld-/g' src/http.c
        sed -i 's/"REST %jd"/"REST %lld"/g' src/conn.c
        
        # 修复 intmax_t 类型转换
        sed -i 's/axl->size/(long long)axl->size/g' src/axel.c
        sed -i 's/axl->bytes_done/(long long)axl->bytes_done/g' src/axel.c
        sed -i 's/axl->start_byte/(long long)axl->start_byte/g' src/axel.c
        sed -i 's/conn->currentbyte/(long long)conn->currentbyte/g' src/conn.c src/http.c
        sed -i 's/conn->lastbyte/(long long)conn->lastbyte/g' src/http.c
        
        # ========== 3. 创建 win32_net.h 包装头文件 ==========
        echo "Creating src/win32_net.h..."
        cat > src/win32_net.h << 'WIN32NET'
#ifndef WIN32_NET_H
#define WIN32_NET_H

#ifdef __MINGW32__
#include <winsock2.h>
#include <ws2tcpip.h>
#include <errno.h>
#include <limits.h>

/* WSA error to POSIX errno mapping */
static inline int ws2errno(int ws_err) {
    switch(ws_err) {
        case WSAEWOULDBLOCK:  return EAGAIN;
        case WSAEINPROGRESS:  return EINPROGRESS;
        case WSAEALREADY:     return EALREADY;
        case WSAEISCONN:      return 0;
        case WSAECONNREFUSED: return ECONNREFUSED;
        case WSAETIMEDOUT:    return ETIMEDOUT;
        case WSAECONNRESET:   return ECONNRESET;
        case WSAENETUNREACH:  return ENETUNREACH;
        case WSAEHOSTUNREACH: return EHOSTUNREACH;
        case WSAEADDRINUSE:   return EADDRINUSE;
        default:              return EIO;
    }
}

/* Thread-safe Winsock init */
static inline void winsock_init_once(void) {
    static volatile LONG init = 0;
    if (InterlockedCompareExchange(&init, 1, 0) == 0) {
        WSADATA wsaData;
        WSAStartup(MAKEWORD(2,2), &wsaData);
    }
}

/* Safe recv wrapper */
static inline int win_read(int fd, void *buf, size_t len) {
    winsock_init_once();
    if (len > INT_MAX) len = INT_MAX;
    int ret = recv((SOCKET)fd, (char*)buf, (int)len, 0);
    if (ret == SOCKET_ERROR) { errno = ws2errno(WSAGetLastError()); return -1; }
    return ret;
}

/* Safe send wrapper */
static inline int win_write(int fd, const void *buf, size_t len) {
    winsock_init_once();
    if (len > INT_MAX) len = INT_MAX;
    int ret = send((SOCKET)fd, (const char*)buf, (int)len, 0);
    if (ret == SOCKET_ERROR) { errno = ws2errno(WSAGetLastError()); return -1; }
    return ret;
}

/* Safe connect wrapper */
static inline int win_connect(int fd, const struct sockaddr *name, int namelen) {
    winsock_init_once();
    int ret = connect((SOCKET)fd, name, namelen);
    if (ret == SOCKET_ERROR) {
        int err = WSAGetLastError();
        if (err == WSAEWOULDBLOCK || err == WSAEINPROGRESS || err == WSAEALREADY)
            errno = EINPROGRESS;
        else if (err == WSAEISCONN)
            return 0;
        else
            errno = ws2errno(err);
        return -1;
    }
    return ret;
}

/* Safe close wrapper */
static inline int win_close(int fd) {
    return closesocket((SOCKET)fd);
}

/* Safe timeout setter */
static inline int win_set_timeout(int fd, int optname, int timeout_sec) {
    DWORD tout = timeout_sec * 1000;
    return setsockopt((SOCKET)fd, SOL_SOCKET, optname, (const char*)&tout, sizeof(tout));
}

/* Conditional macros - only active on MinGW */
#define WIN32_NET_READ(fd, buf, len)   win_read((fd), (buf), (len))
#define WIN32_NET_WRITE(fd, buf, len)  win_write((fd), (buf), (len))
#define WIN32_NET_CONNECT(fd, name, namelen) win_connect((fd), (name), (namelen))
#define WIN32_NET_CLOSE(fd)            win_close(fd)

#else
/* Native POSIX - pass through */
#define WIN32_NET_READ(fd, buf, len)   read((fd), (buf), (len))
#define WIN32_NET_WRITE(fd, buf, len)  write((fd), (buf), (len))
#define WIN32_NET_CONNECT(fd, name, namelen) connect((fd), (name), (namelen))
#define WIN32_NET_CLOSE(fd)            close(fd)
#endif

#endif /* WIN32_NET_H */
WIN32NET

        # ========== 4. 注入 win32_net.h 到网络源文件 ==========
        echo "Injecting win32_net.h into source files..."
        for f in src/tcp.c src/conn.c src/http.c src/ftp.c; do
            [ -f "$f" ] && ! grep -q 'win32_net.h' "$f" && \
                sed -i '/#include "axel.h"/a #include "win32_net.h"' "$f"
        done
        
        # ========== 5. 替换网络函数调用为安全包装 ==========
        echo "Replacing network function calls..."
        for f in src/conn.c src/http.c src/ftp.c src/tcp.c; do
            [ -f "$f" ] || continue
            # 替换 read/write/connect/close 调用（使用我们的条件宏）
            sed -i 's/\bread(\s*\([^)]*\)\s*)/WIN32_NET_READ(\1)/g' "$f"
            sed -i 's/\bwrite(\s*\([^)]*\)\s*)/WIN32_NET_WRITE(\1)/g' "$f"
            sed -i 's/\bconnect(\s*\([^)]*\)\s*)/WIN32_NET_CONNECT(\1)/g' "$f"
            sed -i 's/\bclose(\s*\([^)]*\)\s*)/WIN32_NET_CLOSE(\1)/g' "$f"
        done
        
        # ========== 6. tcp.c 特定修复（用 sed 替代 patch）==========
        echo "Patching src/tcp.c directly..."
        
        # 6.1 修复 tcp_error 函数 - 添加 Windows 版本
        sed -i '/^inline static void$/,/^}$/c\
#ifdef __MINGW32__\
static void tcp_error(char *hostname, int port, const char *reason)\
{\
    int err = WSAGetLastError();\
    fprintf(stderr, "Unable to connect to server %s:%i: Winsock error %d (%s)\\n",\
        hostname, port, err, reason);\
}\
#else\
inline static void\
tcp_error(char *hostname, int port, const char *reason)\
{\
    fprintf(stderr, _("Unable to connect to server %s:%i: %s\\n"),\
        hostname, port, reason);\
}\
#endif' src/tcp.c
        
        # 6.2 移除 fcntl 调用（Windows 不支持）
        sed -i '/fcntl.*F_SETFL.*O_NONBLOCK/d' src/tcp.c
        sed -i '/fcntl.*F_SETFL.*0/d' src/tcp.c
        
        # 6.3 修复 setsockopt 超时设置（Windows 用毫秒）
        sed -i '/struct timeval tout.*tv_sec.*io_timeout/,/setsockopt.*SO_SNDTIMEO/c\
#ifdef __MINGW32__\
    if (io_timeout > 0) {\
        win_set_timeout(sock_fd, SO_RCVTIMEO, io_timeout);\
        win_set_timeout(sock_fd, SO_SNDTIMEO, io_timeout);\
    }\
#else\
    if (io_timeout > 0) {\
        struct timeval tout = { .tv_sec = io_timeout, .tv_usec = 0 };\
        setsockopt(sock_fd, SOL_SOCKET, SO_RCVTIMEO, \&tout, sizeof(tout));\
        setsockopt(sock_fd, SOL_SOCKET, SO_SNDTIMEO, \&tout, sizeof(tout));\
    }\
#endif' src/tcp.c
        
        # 6.4 移除 get_if_ip 函数（Windows 不支持）
        sed -i '/^get_if_ip(/,/^}$/d' src/tcp.c
        
        # ========== 7. 其他平台兼容性修复 ==========
        echo "Applying additional fixes..."
        
        # 固定终端宽度
        sed -i '/^get_term_width(/,/^}/c\
int get_term_width(void) { return 80; }' src/text.c
        
        # 禁用 /dev/random
        sed -i '/^axel_rnd_init(/,/^}/c\
int axel_rnd_init(void) { return 0; }' src/random.c
        
        # 添加 SSL_CTX_set_default_verify_paths 调用（如果存在 SSL 初始化）
        if grep -q "SSL_CTX_new" src/axel.c; then
            sed -i '/SSL_CTX_new/a\    SSL_CTX_set_default_verify_paths(ssl_ctx);' src/axel.c
        fi
        
        echo "All fixes applied successfully!"
        ENDOFSCRIPT

        chmod +x fix-axel.sh
        ./fix-axel.sh

    - name: Prepare build environment
      run: |
        echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
        echo "AR=x86_64-w64-mingw32-ar" >> $GITHUB_ENV
        echo "RANLIB=x86_64-w64-mingw32-ranlib" >> $GITHUB_ENV
        echo "STRIP=x86_64-w64-mingw32-strip" >> $GITHUB_ENV
        
        # 创建 minimal fake-headers
        mkdir -p fake-headers/{netinet,arpa,net,linux,sys}
        for h in in_systm.h ip.h if_ether.h tcp.h; do
            echo "#ifndef _FAKE_H\n#define _FAKE_H\n#include <winsock2.h>\n#endif" > fake-headers/netinet/$h
        done
        echo "#ifndef _FAKE_H\n#define _FAKE_H\n#include <winsock2.h>\n#endif" > fake-headers/arpa/inet.h
        touch fake-headers/net/if.h fake-headers/net/if_arp.h
        touch fake-headers/linux/if_ether.h
        echo "#ifndef _FAKE_H\n#define _FAKE_H\n#include <winsock2.h>\ntypedef int socklen_t;\n#endif" > fake-headers/sys/socket.h
        echo "#ifndef _FAKE_H\n#define _FAKE_H\n#endif" > fake-headers/sys/ioctl.h fake-headers/sys/time.h
        echo "#ifndef _FAKE_H\n#define _FAKE_H\n#include <winsock2.h>\n#endif" > fake-headers/netdb.h
        
        echo "CFLAGS=-O2 -static -D_WIN32_WINNT=0x0601 -D__USE_MINGW_ANSI_STDIO=1 -I$(pwd)/fake-headers -ffunction-sections -fdata-sections" >> $GITHUB_ENV
        echo "LDFLAGS=-static -static-libgcc -static-libstdc++ -Wl,--gc-sections" >> $GITHUB_ENV

    - name: Generate configure script
      run: |
        cd axel
        mkdir -p m4 build-aux
        autoreconf -fi

    - name: Cross compile OpenSSL for Windows (static)
      run: |
        INSTALL_PATH=$(pwd)/openssl-mingw
        mkdir -p "$INSTALL_PATH"
        wget -q https://github.com/openssl/openssl/releases/download/openssl-3.2.4/openssl-3.2.4.tar.gz
        tar xzf openssl-3.2.4.tar.gz
        cd openssl-3.2.4
        
        ./Configure -static --prefix="$INSTALL_PATH" --libdir=lib --openssldir=ssl \
          mingw64 no-shared \
          enable-tls1_2 enable-tls1_3 enable-ec_nistp_64_gcc_128 \
          no-quic no-err no-dso no-engine no-async no-dtls no-sctp \
          no-ssl3 no-tls1 no-tls1_1 no-comp no-docs no-tests no-apps \
          -O2 -ffunction-sections -fdata-sections
          
        make -j$(nproc)
        make install_sw
        
        # 生成 pkg-config 文件
        cd "$INSTALL_PATH/lib"
        cat > libcrypto.pc << EOF
        prefix=$INSTALL_PATH
        exec_prefix=\${prefix}
        libdir=\${exec_prefix}/lib
        includedir=\${prefix}/include
        Name: OpenSSL-libcrypto
        Description: OpenSSL cryptography library
        Version: 3.2.4
        Libs: -L\${libdir} -lcrypto -lws2_32 -lgdi32 -lcrypt32 -ladvapi32 -lbcrypt
        Cflags: -I\${includedir}
        EOF
        cat > libssl.pc << EOF
        prefix=$INSTALL_PATH
        exec_prefix=\${prefix}
        libdir=\${exec_prefix}/lib
        includedir=\${prefix}/include
        Name: OpenSSL
        Description: SSL/TLS library
        Version: 3.2.4
        Requires.private: libcrypto
        Libs: -L\${libdir} -lssl
        Cflags: -I\${includedir}
        EOF

    - name: Configure (Windows static with SSL)
      run: |
        cd axel
        export PKG_CONFIG_PATH=$(pwd)/../openssl-mingw/lib
        ./configure \
          --host=x86_64-w64-mingw32 \
          --disable-nls \
          --disable-dependency-tracking \
          --with-ssl=openssl \
          ac_cv_header_arpa_inet_h=yes \
          ac_cv_header_netdb_h=yes \
          ac_cv_header_netinet_in_h=yes \
          ac_cv_header_sys_socket_h=yes \
          ac_cv_func_nanosleep=yes \
          ac_cv_func_gettimeofday=yes \
          LIBS="-lws2_32 -lcrypt32 -ladvapi32 -lgdi32 -lbcrypt"

    - name: Build
      run: |
        cd axel
        make -j$(nproc) V=1

    - name: Strip and verify binary
      run: |
        cd axel
        x86_64-w64-mingw32-strip --strip-all axel.exe
        file axel.exe
        echo "Binary size: $(du -h axel.exe | cut -f1)"

    - name: Basic test
      run: |
        cd axel
        ./axel.exe --version
        ./axel.exe --help | head -10

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-static-ssl
        path: axel/axel.exe
        retention-days: 30
