name: Build Axel (Windows Static)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          mingw-w64 \
          automake \
          libtool \
          gettext \
          autopoint \
          pkg-config \
          make \
          autoconf-archive \
          txt2man

    - name: Build and Install Autoconf 2.72
      run: |
        wget https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
        tar -xf autoconf-2.72.tar.xz
        cd autoconf-2.72
        ./configure --prefix=/usr/local
        make -j$(nproc)
        sudo make install
        autoconf --version

    - name: Clone axel source
      run: |
        git clone https://github.com/axel-download-accelerator/axel.git
        cd axel
        git submodule update --init --recursive

    - name: Create and run comprehensive fix script
      run: |
        cd axel
        cat > fix-axel.sh << 'EOF'
        #!/bin/bash
        set -e

        echo "Applying Windows compatibility fixes..."

        # ---------- src/axel.h modifications ----------
        sed -i '/^#include <sys\/time.h>/a \
        \
        /* Windows/MinGW compatibility */\
        #ifdef __MINGW32__\
        #include <stdint.h>\
        #include <ws2tcpip.h>\
        #include <winsock2.h>\
        #define sa_family_t ADDRESS_FAMILY\
        #define AF_INET   2\
        #define AF_INET6  23\
        #define AF_UNSPEC 0\
        #endif' src/axel.h

        sed -i 's|^#include <net/if.h>|/* #include <net/if.h> */  /* Not needed on Windows */|' src/axel.h

        sed -i '/^#include "search.h"/a \
        \
        /* Windows defines min/max, undefine to use Axel'\''s own */\
        #ifdef min\
        #undef min\
        #endif\
        #ifdef max\
        #undef max\
        #endif' src/axel.h

        echo '' >> src/axel.h
        echo '/* Windows lacks ssize_t */' >> src/axel.h
        echo 'typedef long long ssize_t;' >> src/axel.h
        sed -i '/^#define UINT64_C(c) c ## ULL$/d' src/axel.h

        # ---------- Format specifier fixes ----------
        sed -i 's|"File size: %s (%jd bytes)"|"File size: %s (%lld bytes)"|' src/axel.c
        sed -i 's|"State file found: %jd bytes downloaded, %jd to go."|"State file found: %lld bytes downloaded, %lld to go."|' src/axel.c
        sed -i 's|"REST %jd"|"REST %lld"|' src/conn.c
        sed -i '/axl_message.*File size/s/axl->size/(long long)axl->size/' src/axel.c
        sed -i '/State file found/s/axl->bytes_done/(long long)axl->bytes_done/; /State file found/s/axl->start_byte/(long long)axl->start_byte/' src/axel.c
        sed -i '/ftp_command.*REST/s/conn->currentbyte/(long long)conn->currentbyte/' src/conn.c

        sed -i 's|"Range: bytes=%jd-%jd"|"Range: bytes=%lld-%lld"|' src/http.c
        sed -i 's|"Range: bytes=%jd-"|"Range: bytes=%lld-"|' src/http.c
        sed -i '/http_addheader.*Range: bytes=%lld-%lld/s/conn->lastbyte, conn->currentbyte/(long long)conn->lastbyte, (long long)conn->currentbyte/' src/http.c
        sed -i '/http_addheader.*Range: bytes=%lld-/s/conn->currentbyte/(long long)conn->currentbyte/' src/http.c

        # ---------- src/tcp.c: Replace fcntl with ioctlsocket ----------
        sed -i 's/fcntl(sock_fd, F_SETFL, O_NONBLOCK)/{\
        \tunsigned long mode = 1;\
        \tioctlsocket(sock_fd, FIONBIO, \&mode);\
        }/g' src/tcp.c
        sed -i 's/fcntl(sock_fd, F_SETFL, 0)/{\
        \tunsigned long mode = 0;\
        \tioctlsocket(sock_fd, FIONBIO, \&mode);\
        }/g' src/tcp.c

        sed -i '/struct timeval tout;/c\\tDWORD tout = DEFAULT_IO_TIMEOUT * 1000;' src/tcp.c

        sed -i 's|setsockopt(sock_fd, SOL_SOCKET, SO_RCVTIMEO, &tout, sizeof(tout))|setsockopt(sock_fd, SOL_SOCKET, SO_RCVTIMEO, (const char *)\&tout, sizeof(tout))|' src/tcp.c
        sed -i 's|setsockopt(sock_fd, SOL_SOCKET, SO_SNDTIMEO, &tout, sizeof(tout))|setsockopt(sock_fd, SOL_SOCKET, SO_SNDTIMEO, (const char *)\&tout, sizeof(tout))|' src/tcp.c

        # ---------- Override get_if_ip with a simple stub ----------
        sed -i '/^get_if_ip(/,/^}/c\
        get_if_ip(char *dst, size_t len, const char *iface)\
        {\
        \t(void)dst;\
        \t(void)len;\
        \t(void)iface;\
        \treturn -1;\
        }' src/tcp.c

        # ---------- Override get_term_width with a simple stub ----------
        sed -i '/^get_term_width(/,/^}/c\
        get_term_width(void)\
        {\
        \treturn 80;\
        }' src/text.c

        # ---------- src/random.c: Disable /dev/random requirement ----------
        sed -i '/^axel_rnd_init(/,/^}/c\
        axel_rnd_init(void)\
        {\
        \treturn 0;\
        }' src/random.c

        echo "All fixes applied."
        EOF

        chmod +x fix-axel.sh
        ./fix-axel.sh

    - name: Prepare build environment
      run: |
        echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
        echo "AR=x86_64-w64-mingw32-ar" >> $GITHUB_ENV
        echo "RANLIB=x86_64-w64-mingw32-ranlib" >> $GITHUB_ENV
        echo "STRIP=x86_64-w64-mingw32-strip" >> $GITHUB_ENV
        mkdir -p fake-headers/netinet
        touch fake-headers/netinet/in_systm.h
        touch fake-headers/netinet/in.h
        touch fake-headers/netinet/ip.h
        touch fake-headers/netinet/if_ether.h
        touch fake-headers/netinet/tcp.h
        mkdir -p fake-headers/arpa
        touch fake-headers/arpa/inet.h
        mkdir -p fake-headers/net
        touch fake-headers/net/if.h
        touch fake-headers/net/if_arp.h
        mkdir -p fake-headers/linux
        touch fake-headers/linux/if_ether.h
        mkdir -p fake-headers/sys
        touch fake-headers/sys/socket.h
        touch fake-headers/sys/ioctl.h
        touch fake-headers/netdb.h
        echo "CFLAGS=-O2 -static -D_WIN32_WINNT=0x0600 -DO_NONBLOCK=0x4000 -D__USE_MINGW_ANSI_STDIO=1 -I$(pwd)/fake-headers" >> $GITHUB_ENV
        echo "LDFLAGS=-static -static-libgcc -static-libstdc++" >> $GITHUB_ENV

    - name: Generate configure script
      run: |
        cd axel
        mkdir -p m4 build-aux
        autoreconf -fi

    - name: Configure (Windows static)
      run: |
        cd axel
        ./configure \
          --host=x86_64-w64-mingw32 \
          --disable-nls \
          --without-ssl \
          ac_cv_header_arpa_inet_h=yes \
          ac_cv_header_netdb_h=yes \
          ac_cv_header_netinet_in_h=yes \
          ac_cv_header_netinet_in_systm_h=yes \
          ac_cv_header_netinet_ip_h=yes \
          ac_cv_header_netinet_if_ether_h=yes \
          ac_cv_header_netinet_tcp_h=yes \
          ac_cv_header_net_if_h=yes \
          ac_cv_header_net_if_arp_h=yes \
          ac_cv_header_linux_if_ether_h=yes \
          ac_cv_header_sys_socket_h=yes \
          ac_cv_header_sys_time_h=yes \
          ac_cv_header_sys_ioctl_h=yes \
          ac_cv_header_sys_select_h=yes \
          ac_cv_header_termios_h=yes \
          ac_cv_func_nanosleep=yes \
          ac_cv_func_gettimeofday=yes \
          ac_cv_func_select=yes \
          ac_cv_decl_O_NONBLOCK=yes \
          LIBS="-lws2_32"

    - name: Build
      run: |
        cd axel
        make -j$(nproc)

    - name: Strip binary
      run: |
        cd axel
        x86_64-w64-mingw32-strip axel.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-static
        path: axel/axel.exe
