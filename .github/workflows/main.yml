name: Build Axel (Windows Static)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-upx
            autoconf
            automake
            automake-wrapper
            libtool
            make
            pkgconf
            git

      - name: Build Axel (100% Static Windows)
        shell: msys2 {0}
        run: |
          # 1. 克隆源码并删除 gettext（彻底去掉 --disable-nls 警告）
          git clone https://github.com/axel-download-accelerator/axel.git axel-src
          cd axel-src
          rm -rf po

          # 2. 彻底删除所有会导致报错的 POSIX 检查 + 错误退出
          sed -i '/AC_CHECK_HEADERS.*arpa\/inet\.h/,/arpa\/inet\.h is required/d' configure.ac
          sed -i '/AC_CHECK_HEADERS.*netinet\/in\.h/,/netinet.*h is required/d' configure.ac
          sed -i '/AC_CHECK_HEADERS.*sys\/socket\.h/,/sys\/socket.*h is required/d' configure.ac
          sed -i '/AC_CHECK_HEADERS.*unistd\.h/,/unistd.*h is required/d' configure.ac

          # 删除所有 gettext/NLS 相关代码（彻底消除 --disable-nls 警告）
          sed -i '/AM_GNU_GETTEXT/d' configure.ac
          sed -i '/USE_NLS/d' configure.ac
          sed -i 's|po/Makefile.in po||g' configure.ac

          # 添加 Windows 专用宏，骗过 configure
          cat >> configure.ac <<'EOF'

          # === Windows/MinGW 专用处理 ===
          AX_CHECK_WIN32
          AC_DEFUN([AX_CHECK_WIN32], [
            AS_CASE([$host],
              [*-mingw*], [
                AC_DEFINE([WIN32], 1, [Building on Windows])
                AC_DEFINE([_WIN32_WINNT], [0x0600], [Windows Vista+])
                AC_DEFINE([HAVE_ARPA_INET_H], 0)
                AC_DEFINE([HAVE_NETINET_IN_H], 0)
                AC_DEFINE([HAVE_SYS_SOCKET_H], 0)
                AC_DEFINE([HAVE_UNISTD_H], 0)
                AC_DEFINE([HAVE_NANOSLEEP], 1)
              ])
          ])
          AX_CHECK_WIN32
          EOF

          # 3. 必要的 autotools 支持
          sed -i '/AM_INIT_AUTOMAKE/a LT_INIT' configure.ac
          mkdir -p m4

          # 4. Windows 兼容头 + nanosleep stub
          cat > src/compat-win32.h <<'EOF'
          #ifndef COMPAT_WIN32_H
          #define COMPAT_WIN32_H
          #ifdef _WIN32
          #define _WIN32_WINNT 0x0600
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #include <windows.h>
          typedef SOCKET axel_socket_t;
          #define SHUT_RDWR SD_BOTH
          #define EINPROGRESS WSAEWOULDBLOCK
          #define closesocket(s) closesocket(s)
          #define SOCK_ISINVALID(s) ((s) == INVALID_SOCKET)
          int nanosleep(const struct timespec *req, struct timespec *rem);
          #endif
          #endif
          EOF

          cat > src/nanosleep.c <<'EOF'
          #ifdef _WIN32
          #include <windows.h>
          int nanosleep(const struct timespec *req, struct timespec *rem)
          {
              (void)rem;
              DWORD ms = (DWORD)(req->tv_sec * 1000 + req->tv_nsec / 1000000);
              Sleep(ms ? ms : 1);
              return 0;
          }
          #endif
          EOF

          # 5. 关键源码替换（最简最稳）
          sed -i '1i #include "compat-win32.h"' src/axel.h
          sed -i 's/int fd;/axel_socket_t fd;/g' src/tcp.* src/*.c
          sed -i 's/close(fd)/closesocket(fd)/g' src/*.c
          sed -i 's/close(tcp->fd)/closesocket(tcp->fd)/g' src/*.c
          sed -i 's/read(/recv(/g' src/*.c
          sed -i 's/write(/send(/g' src/*.c
          sed -i 's/fd == -1/SOCK_ISINVALID(fd)/g' src/*.c

          # Winsock 初始化/清理
          sed -i '/int main(/a\
          #ifdef _WIN32\
          WSADATA wsaData;\
          if (WSAStartup(MAKEWORD(2,2), &wsaData) != 0) return 1;\
          #endif' src/text.c

          sed -i '/return .*;/i\
          #ifdef _WIN32\
          WSACleanup();\
          #endif' src/text.c

          # 6. 最简 Makefile.am（保证静态链接）
          cat > src/Makefile.am <<'EOF'
          bin_PROGRAMS = axel
          axel_SOURCES = $(wildcard src/*.c) nanosleep.c
          axel_CFLAGS = -DWIN32
          axel_LDFLAGS = -all-static
          axel_LDADD = -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lz
          EOF

          # 7. 生成 configure
          autoreconf -fi

          # 8. 配置 & 编译（最干净的命令）
          export PKG_CONFIG="pkgconf --static"
          export CFLAGS="-O3 -march=x86-64-v3 -flto=auto -pipe"
          export LDFLAGS="-static -static-libgcc -static-libstdc++"

          ./configure --host=x86_64-w64-mingw32 --with-ssl

          make -j$(nproc)

          strip axel.exe
          upx --best --lzma axel.exe

          echo "Build 成功！"
          ls -lh axel.exe
          file axel.exe
          ./axel.exe --version

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axel-windows-x64-static
          path: axel-src/axel.exe
