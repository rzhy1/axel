name: Build Axel Windows Static

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >
          base-devel
          mingw-w64-x86_64-toolchain
          autoconf
          automake
          libtool
          make
          pkgconf
          wget
          patch

    - name: Extract patched Axel source
      shell: msys2 {0}
      run: |
        mkdir axel-src
        tar -xzf axel-windows-patched.tar.gz -C axel-src --strip-components=1
        ls -l axel-src

    - name: Prepare autotools
      shell: msys2 {0}
      run: |
        cd axel-src

        # 确保 autotools 基础文件齐全
        mkdir -p build-aux m4

        libtoolize --force --copy --install
        aclocal -I m4
        autoheader
        automake --add-missing --copy --force-missing --no-dependencies
        autoconf

    - name: Configure (MinGW)
      shell: msys2 {0}
      run: |
        cd axel-src

        ./configure \
          --host=x86_64-w64-mingw32 \
          --disable-nls \
          --disable-dependency-tracking \
          --prefix=/usr/local

    - name: Build static axel.exe
      shell: msys2 {0}
      run: |
        cd axel-src

        make -j$(nproc) \
          CFLAGS="-static -O2 -DWIN32 -D_GNU_SOURCE -include winsock2.h -include ws2tcpip.h" \
          LIBS="-lws2_32 -lssl -lcrypto -lcrypt32"

        file src/axel.exe || true

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-static
        path: axel-src/src/axel.exe
