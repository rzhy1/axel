name: Build Axel (Windows Static) with HTTPS Support

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          mingw-w64 \
          automake \
          libtool \
          gettext \
          autopoint \
          pkg-config \
          make \
          autoconf-archive \
          txt2man

    - name: Build and Install Autoconf 2.72
      run: |
        wget https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
        tar -xf autoconf-2.72.tar.xz
        cd autoconf-2.72
        ./configure --prefix=/usr/local
        make -j$(nproc)
        sudo make install
        autoconf --version

    - name: Clone axel source
      run: |
        git clone https://github.com/axel-download-accelerator/axel.git
        cd axel
        git submodule update --init --recursive

    - name: Create and run comprehensive fix script
      run: |
        cd axel
        cat > fix-axel.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "Applying Windows compatibility fixes..."
        
        # ---------- src/axel.h: 添加 Windows 支持 ----------
        sed -i '/^#include <sys\/time.h>/a \
        \
        /* Windows/MinGW compatibility */\
        #ifdef __MINGW32__\
        #include <stdint.h>\
        #include <ws2tcpip.h>\
        #include <winsock2.h>\
        #define sa_family_t ADDRESS_FAMILY\
        #define AF_INET   2\
        #define AF_INET6  23\
        #define AF_UNSPEC 0\
        #endif' src/axel.h
        
        sed -i 's|^#include <net/if.h>|/* #include <net/if.h> */|' src/axel.h
        
        sed -i '/^#include "search.h"/a \
        \
        /* Windows defines min/max, undefine to use Axel'\''s own */\
        #ifdef min\
        #undef min\
        #endif\
        #ifdef max\
        #undef max\
        #endif' src/axel.h
        
        echo '' >> src/axel.h
        echo '/* Windows lacks ssize_t */' >> src/axel.h
        echo '#ifdef __MINGW32__' >> src/axel.h
        echo 'typedef long long ssize_t;' >> src/axel.h
        echo '#endif' >> src/axel.h
        
        # ---------- 格式化修正 ----------
        sed -i 's|"File size: %s (%jd bytes)"|"File size: %s (%lld bytes)"|' src/axel.c
        sed -i 's|"State file found: %jd bytes downloaded, %jd to go."|"State file found: %lld bytes downloaded, %lld to go."|' src/axel.c
        sed -i 's|"REST %jd"|"REST %lld"|' src/conn.c
        sed -i '/axl_message.*File size/s/axl->size/(long long)axl->size/' src/axel.c
        sed -i '/State file found/s/axl->bytes_done/(long long)axl->bytes_done/; /State file found/s/axl->start_byte/(long long)axl->start_byte/' src/axel.c
        sed -i '/ftp_command.*REST/s/conn->currentbyte/(long long)conn->currentbyte/' src/conn.c
        
        sed -i 's|"Range: bytes=%jd-%jd"|"Range: bytes=%lld-%lld"|' src/http.c
        sed -i 's|"Range: bytes=%jd-"|"Range: bytes=%lld-"|' src/http.c
        sed -i '/http_addheader.*Range: bytes=%lld-%lld/s/conn->lastbyte, conn->currentbyte/(long long)conn->lastbyte, (long long)conn->currentbyte/' src/http.c
        sed -i '/http_addheader.*Range: bytes=%lld-/s/conn->currentbyte/(long long)conn->currentbyte/' src/http.c
        
        # ---------- 创建 Windows 网络 I/O 包装头文件 ----------
        echo "Creating win32_net.h wrapper..."
        cat > src/win32_net.h << 'HEADER'
        #ifndef WIN32_NET_H
        #define WIN32_NET_H
        
        #ifdef __MINGW32__
        #include <winsock2.h>
        #include <errno.h>
        
        /* Winsock 初始化（只执行一次） */
        static inline void winsock_init_once(void) {
            static int init = 0;
            if (!init) {
                WSADATA wsaData;
                if (WSAStartup(MAKEWORD(2,2), &wsaData) == 0)
                    init = 1;
            }
        }
        
        /* Windows recv 包装，映射错误码到 errno */
        static inline int win_read(int fd, void *buf, size_t len) {
            winsock_init_once();
            int ret = recv(fd, (char*)buf, (int)len, 0);
            if (ret == SOCKET_ERROR) {
                int err = WSAGetLastError();
                if (err == WSAEWOULDBLOCK) errno = EAGAIN;
                else errno = err;
                return -1;
            }
            return ret;
        }
        
        /* Windows send 包装，映射错误码到 errno */
        static inline int win_write(int fd, const void *buf, size_t len) {
            winsock_init_once();
            int ret = send(fd, (const char*)buf, (int)len, 0);
            if (ret == SOCKET_ERROR) {
                int err = WSAGetLastError();
                if (err == WSAEWOULDBLOCK) errno = EAGAIN;
                else errno = err;
                return -1;
            }
            return ret;
        }
        
        /* Windows connect 包装，处理非阻塞状态 */
        static inline int win_connect(int fd, const struct sockaddr *name, int namelen) {
            winsock_init_once();
            int ret = connect(fd, name, namelen);
            if (ret == SOCKET_ERROR) {
                int err = WSAGetLastError();
                if (err == WSAEWOULDBLOCK || err == WSAEINPROGRESS || err == WSAEALREADY) {
                    errno = EINPROGRESS;
                } else if (err == WSAEISCONN) {
                    return 0;
                } else {
                    errno = err;
                }
                return -1;
            }
            return ret;
        }
        
        /* Windows closesocket 包装 */
        static inline int win_close(int fd) {
            return closesocket(fd);
        }
        
        /* 替换宏：网络相关函数使用 Winsock 版本 */
        #define read(fd, buf, len)   win_read((fd), (buf), (len))
        #define write(fd, buf, len)  win_write((fd), (buf), (len))
        #define connect(fd, name, namelen) win_connect((fd), (name), (namelen))
        #define close(fd)            win_close(fd)
        
        #endif /* __MINGW32__ */
        #endif /* WIN32_NET_H */
        HEADER
        
        # ---------- 将包装头文件注入网络源文件 ----------
        echo "Injecting win32_net.h into network source files..."
        for f in src/tcp.c src/conn.c src/http.c src/ftp.c; do
            if [ -f "$f" ]; then
                sed -i '/#include "axel.h"/a #include "win32_net.h"' "$f"
            fi
        done
        
        # ---------- 修正 tcp_error 以输出 Winsock 错误码 ----------
        sed -i '/^inline static void$/,/^}$/c\
        #ifdef __MINGW32__\
        static void tcp_error(char *hostname, int port, const char *reason)\
        {\
        \tint err = WSAGetLastError();\
        \tfprintf(stderr, "Unable to connect to server %s:%i: Winsock error %d\\n",\
        \t\thostname, port, err);\
        }\
        #else\
        inline static void\
        tcp_error(char *hostname, int port, const char *reason)\
        {\
        \tfprintf(stderr, _("Unable to connect to server %s:%i: %s\\n"),\
        \t\thostname, port, reason);\
        }\
        #endif' src/tcp.c
        
        # ---------- 移除 fcntl 非阻塞设置（包装器已处理错误码映射）----------
        sed -i 's/^\t\t\tfcntl(sock_fd, F_SETFL, O_NONBLOCK);$/\/\/ fcntl(F_SETFL, O_NONBLOCK) not needed on Windows/' src/tcp.c
        sed -i 's/^\tfcntl(sock_fd, F_SETFL, 0);$/\/\/ fcntl(F_SETFL, 0) not needed on Windows/' src/tcp.c
        
        # ---------- 修正 setsockopt 超时部分（无多余分号）----------
        # 1. 替换 tout 定义
        sed -i '/\/\* Set I\/O timeout \*\//,/;/ {
            s/struct timeval tout = { \.tv_sec  = io_timeout };/#ifdef __MINGW32__\n\tDWORD tout = io_timeout * 1000;\n#else\n\tstruct timeval tout = { .tv_sec = io_timeout };\n#endif/
        }' src/tcp.c
        
        # 2. 替换 SO_RCVTIMEO 调用
        sed -i '/setsockopt(sock_fd, SOL_SOCKET, SO_RCVTIMEO, &tout, sizeof(tout))/ {
            s/setsockopt(sock_fd, SOL_SOCKET, SO_RCVTIMEO, &tout, sizeof(tout))/#ifdef __MINGW32__\n\tsetsockopt(sock_fd, SOL_SOCKET, SO_RCVTIMEO, (const char *)\&tout, sizeof(tout));\n#else\n\tsetsockopt(sock_fd, SOL_SOCKET, SO_RCVTIMEO, \&tout, sizeof(tout));\n#endif/
        }' src/tcp.c
        
        # 3. 替换 SO_SNDTIMEO 调用
        sed -i '/setsockopt(sock_fd, SOL_SOCKET, SO_SNDTIMEO, &tout, sizeof(tout))/ {
            s/setsockopt(sock_fd, SOL_SOCKET, SO_SNDTIMEO, &tout, sizeof(tout))/#ifdef __MINGW32__\n\tsetsockopt(sock_fd, SOL_SOCKET, SO_SNDTIMEO, (const char *)\&tout, sizeof(tout));\n#else\n\tsetsockopt(sock_fd, SOL_SOCKET, SO_SNDTIMEO, \&tout, sizeof(tout));\n#endif/
        }' src/tcp.c
        
        # ---------- 其他必要修正 ----------
        # 禁用 get_if_ip
        sed -i '/^get_if_ip(/,/^}/c\
        get_if_ip(char *dst, size_t len, const char *iface)\
        {\
        \t(void)dst;\
        \t(void)len;\
        \t(void)iface;\
        \treturn -1;\
        }' src/tcp.c
        
        # 固定终端宽度
        sed -i '/^get_term_width(/,/^}/c\
        get_term_width(void)\
        {\
        \treturn 80;\
        }' src/text.c
        
        # 禁用 /dev/random
        sed -i '/^axel_rnd_init(/,/^}/c\
        axel_rnd_init(void)\
        {\
        \treturn 0;\
        }' src/random.c
        
        echo "All fixes applied."
        EOF

        chmod +x fix-axel.sh
        ./fix-axel.sh

    - name: Prepare build environment
      run: |
        echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
        echo "AR=x86_64-w64-mingw32-ar" >> $GITHUB_ENV
        echo "RANLIB=x86_64-w64-mingw32-ranlib" >> $GITHUB_ENV
        echo "STRIP=x86_64-w64-mingw32-strip" >> $GITHUB_ENV
        mkdir -p fake-headers/netinet
        touch fake-headers/netinet/in_systm.h
        touch fake-headers/netinet/in.h
        touch fake-headers/netinet/ip.h
        touch fake-headers/netinet/if_ether.h
        touch fake-headers/netinet/tcp.h
        mkdir -p fake-headers/arpa
        touch fake-headers/arpa/inet.h
        mkdir -p fake-headers/net
        touch fake-headers/net/if.h
        touch fake-headers/net/if_arp.h
        mkdir -p fake-headers/linux
        touch fake-headers/linux/if_ether.h
        mkdir -p fake-headers/sys
        touch fake-headers/sys/socket.h
        touch fake-headers/sys/ioctl.h
        touch fake-headers/netdb.h
        echo "CFLAGS=-O2 -static -D_WIN32_WINNT=0x0600 -DO_NONBLOCK=0x4000 -D__USE_MINGW_ANSI_STDIO=1 -I$(pwd)/fake-headers" >> $GITHUB_ENV
        echo "LDFLAGS=-static -static-libgcc -static-libstdc++" >> $GITHUB_ENV

    - name: Generate configure script
      run: |
        cd axel
        mkdir -p m4 build-aux
        autoreconf -fi

    - name: Cross compile OpenSSL for Windows (static, optimized)
      run: |
        INSTALL_PATH=$(pwd)/openssl-mingw
        mkdir -p "$INSTALL_PATH"
        wget -q https://github.com/openssl/openssl/releases/download/openssl-3.6.2/openssl-3.6.2.tar.gz
        tar xzf openssl-3.6.2.tar.gz
        cd openssl-3.6.2 || exit
        DISABLED_FEATURES=(
          no-quic no-err no-dso no-engine no-async
          no-dtls no-sctp no-ssl3 no-tls1 no-tls1_1
          no-comp no-ts no-ocsp no-ct no-cms no-psk no-srp no-srtp no-rfc3779
          no-fips no-acvp-tests no-docs no-stdio no-ui-console
          no-afalgeng no-ssl-trace no-filenames
          no-aria no-bf no-blake2 no-camellia no-cast no-cmac
          no-dsa no-ec2m no-gost no-idea no-rc2 no-rc4 no-rc5 no-rmd160
          no-scrypt no-seed no-siphash no-siv no-sm2 no-sm3 no-sm4 no-whirlpool
          no-tests no-apps
        )
        CFLAGS="-O2 -ffunction-sections -fdata-sections -pipe -g0 -fvisibility=hidden"
        LDFLAGS="-Wl,--gc-sections -Wl,--icf=all -static -static-libgcc"
        ./Configure -static \
          --prefix="$INSTALL_PATH" \
          --libdir=lib \
          mingw64 no-shared \
          "${DISABLED_FEATURES[@]}" \
          $CFLAGS \
          $LDFLAGS
        make -j$(nproc)
        make install_sw
        cd "$INSTALL_PATH/lib"
        cat > libcrypto.pc << EOF
        prefix=$INSTALL_PATH
        exec_prefix=\${prefix}
        libdir=\${exec_prefix}/lib
        includedir=\${prefix}/include

        Name: OpenSSL-libcrypto
        Description: OpenSSL cryptography library
        Version: 3.6.2
        Libs: -L\${libdir} -lcrypto -lws2_32 -lgdi32 -lcrypt32 -ladvapi32
        Cflags: -I\${includedir}
        EOF

        cat > libssl.pc << EOF
        prefix=$INSTALL_PATH
        exec_prefix=\${prefix}
        libdir=\${exec_prefix}/lib
        includedir=\${prefix}/include

        Name: OpenSSL
        Description: Secure Sockets Layer and cryptography libraries
        Version: 3.6.2
        Requires.private: libcrypto
        Libs: -L\${libdir} -lssl
        Cflags: -I\${includedir}
        EOF

    - name: Configure (Windows static with SSL)
      run: |
        cd axel
        export PKG_CONFIG_PATH=$(pwd)/../openssl-mingw/lib
        ./configure \
          --host=x86_64-w64-mingw32 \
          --disable-nls \
          --with-ssl=openssl \
          ac_cv_header_arpa_inet_h=yes \
          ac_cv_header_netdb_h=yes \
          ac_cv_header_netinet_in_h=yes \
          ac_cv_header_netinet_in_systm_h=yes \
          ac_cv_header_netinet_ip_h=yes \
          ac_cv_header_netinet_if_ether_h=yes \
          ac_cv_header_netinet_tcp_h=yes \
          ac_cv_header_net_if_h=yes \
          ac_cv_header_net_if_arp_h=yes \
          ac_cv_header_linux_if_ether_h=yes \
          ac_cv_header_sys_socket_h=yes \
          ac_cv_header_sys_time_h=yes \
          ac_cv_header_sys_ioctl_h=yes \
          ac_cv_header_sys_select_h=yes \
          ac_cv_header_termios_h=yes \
          ac_cv_func_nanosleep=yes \
          ac_cv_func_gettimeofday=yes \
          ac_cv_func_select=yes \
          ac_cv_decl_O_NONBLOCK=yes \
          LIBS="-lws2_32 -ladvapi32"

    - name: Build
      run: |
        cd axel
        make -j$(nproc)

    - name: Strip binary
      run: |
        cd axel
        x86_64-w64-mingw32-strip axel.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-static-ssl
        path: axel/axel.exe
