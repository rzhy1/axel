name: Build Super Downloader (Windows EXE)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies for cross-compilation
      run: |
        sudo apt update
        sudo apt install -y git cmake g++-multilib mingw-w64 unzip

    - name: Clone and bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git $HOME/vcpkg
        $HOME/vcpkg/bootstrap-vcpkg.sh

    - name: Create custom mingw triplet
      run: |
        mkdir -p $HOME/vcpkg/triplets/community
        echo 'set(VCPKG_TARGET_ARCHITECTURE x64)
set(VCPKG_CMAKE_SYSTEM_NAME Windows)
set(VCPKG_C_COMPILER x86_64-w64-mingw32-gcc)
set(VCPKG_CXX_COMPILER x86_64-w64-mingw32-g++)
set(VCPKG_LIBRARY_LINKAGE static)
set(VCPKG_BUILD_TYPE release)' > $HOME/vcpkg/triplets/community/x64-windows-mingw.cmake

    - name: Install Windows dependencies via vcpkg (mingw)
      run: |
        $HOME/vcpkg/vcpkg install curl:x64-windows-mingw openssl:x64-windows-mingw
        $HOME/vcpkg/vcpkg integrate install

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake (cross compile Windows exe)
      run: |
        cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-windows-mingw \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Windows exe
      uses: actions/upload-artifact@v4
      with:
        name: super_downloader
        path: build/Release/*.exe
