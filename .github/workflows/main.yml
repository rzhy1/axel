name: Build Axel Windows Static (Final Working 2025)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-upx
            autoconf
            automake
            automake-wrapper
            libtool
            make
            pkgconf
            git
            autoconf-archive

      - name: Build Axel (Pure Static, No DLLs)
        shell: msys2 {0}
        run: |
          git clone https://github.com/axel-download-accelerator/axel.git axel-src
          cd axel-src
          rm -rf po

          # 1. 彻底删除所有 POSIX 头文件检查 + 错误退出（关键！）
          sed -i '/AC_CHECK_HEADERS(\[ \\\/],/,/AC_MSG_ERROR/d' configure.ac

          # 2. 删除 gettext（避免 po 目录错误）
          sed -i '/AM_GNU_GETTEXT/d' configure.ac
          sed -i '/po\/Makefile.in/d' configure.ac

          # 3. 在 AC_CANONICAL_HOST 之前插入 Windows 专用宏（最稳方案）
          sed -i '/AC_CANONICAL_HOST/i\
          AS_CASE([$host],\
            [*-mingw*], [\
              AC_DEFINE([WIN32], [1], [Building on Windows])\
              AC_DEFINE([_WIN32_WINNT], [0x0600], [Enable modern Winsock])\
              AC_DEFINE([HAVE_ARPA_INET_H], [1])\
              AC_DEFINE([HAVE_NETINET_IN_H], [1])\
              AC_DEFINE([HAVE_SYS_SOCKET_H], [1])\
              AC_DEFINE([HAVE_UNISTD_H], [1])\
              AC_DEFINE([HAVE_NANOSLEEP], [1])\
            ])' configure.ac

          # 4. 确保 LT_INIT 和 m4 目录
          sed -i '/AM_INIT_AUTOMAKE/a LT_INIT' configure.ac
          mkdir -p m4 build-aux

          # 5. 条件化头文件包含（防止编译错误）
          find src -type f -name "*.c" -o -name "*.h" | xargs sed -i \
            -e 's/#include <arpa\/inet\.h>/#ifndef _WIN32\n#include <arpa\/inet\.h>\n#endif/g' \
            -e 's/#include <netinet\/in\.h>/#ifndef _WIN32\n#include <netinet\/in\.h>\n#endif/g' \
            -e 's/#include <sys\/socket\.h>/#ifndef _WIN32\n#include <sys\/socket\.h>\n#endif/g' \
            -e 's/#include <unistd\.h>/#ifndef _WIN32\n#include <unistd\.h>\n#endif/g'

          # 6. 添加 Winsock 初始化
          sed -i '/int main(/a\
          #ifdef _WIN32\
          WSADATA wsaData;\
          if (WSAStartup(MAKEWORD(2,2), &wsaData) != 0) {\
              fprintf(stderr, "WSAStartup failed\\n");\
              return 1;\
          }\
          #endif' src/text.c

          sed -i '/return /i\
          #ifdef _WIN32\
          WSACleanup();\
          #endif' src/text.c

          # 7. nanosleep stub（官方没有，就自己加）
          cat > src/nanosleep.c <<'EOF'
          #ifdef _WIN32
          #include <windows.h>
          int nanosleep(const struct timespec *req, struct timespec *rem) {
              (void)rem;
              DWORD ms = (DWORD)(req->tv_sec * 1000 + req->tv_nsec / 1000000);
              Sleep(ms ? ms : 1);
              return 0;
          }
          #endif
          EOF

          # 8. 强制静态链接的 Makefile.am
          cat > src/Makefile.am <<'EOF'
          bin_PROGRAMS = axel
          axel_SOURCES = $(wildcard *.c) nanosleep.c
          axel_CFLAGS = -DWIN32 -DHAVE_SSL
          axel_LDFLAGS = -all-static
          axel_LDADD = -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lz
          EOF

          cat > Makefile.am <<'EOF'
          AUTOMAKE_OPTIONS = foreign
          ACLOCAL_AMFLAGS = -I m4
          SUBDIRS = src
          EOF

          # 9. 生成 configure（这次一定成功）
          autoreconf -fi

          # 10. 配置 + 编译
          export PKG_CONFIG="pkgconf --static"
          export CFLAGS="-O3 -march=x86-64 -flto=auto -pipe"
          export LDFLAGS="-static -static-libgcc -static-libstdc++"

          ./configure --host=x86_64-w64-mingw32 --with-ssl=openssl

          make -j$(nproc)
          strip axel.exe
          upx --best --lzma axel.exe

          echo "Build 成功！"
          ls -lh axel.exe
          ./axel.exe --version

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axel-windows-static
          path: axel-src/axel.exe
