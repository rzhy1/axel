name: Build Super Downloader

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: macos-latest
            cc: clang
          - os: windows-latest
            cc: msvc

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libssl-dev

    - name: Setup dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install cmake curl openssl
        export PATH="/usr/local/opt/curl/bin:$PATH"

    - name: Setup dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install -y vcpkg
        set VCPKG_ROOT=%ProgramData%\chocolatey\lib\vcpkg\tools\vcpkg
        echo "vcpkg root: %VCPKG_ROOT%"
        %VCPKG_ROOT%\vcpkg install curl[ssl]:x64-windows openssl:x64-windows
      shell: cmd

    - name: Configure & Build
      run: |
        mkdir -p build
        cd build
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cmake -G "Visual Studio 17 2022" -A x64 ..
          cmake --build . --config Release
        else
          cmake ..
          cmake --build . --config Release -j$(nproc)
        fi
      shell: bash
