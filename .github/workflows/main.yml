name: Build Axel (Windows Static no NLS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-upx
          autoconf
          automake
          automake-wrapper
          libtool
          make
          pkgconf
          git

    - name: Clone & Patch Axel (终极 Windows 版)
      shell: msys2 {0}
      run: |
        git clone https://github.com/axel-download-accelerator/axel.git axel-src
        cd axel-src
        rm -rf po

        # 1. 直接暴力删掉所有会导致 configure 报错的 POSIX 检查 + 错误退出
        sed -i '/AC_CHECK_HEADERS(\[arpa\/inet\.h/,/arpa\/inet\.h is required/d' configure.ac
        sed -i '/AC_CHECK_HEADERS(\[netinet\/in\.h/,/netinet.*h is required/d' configure.ac
        sed -i '/AC_CHECK_HEADERS(\[sys\/socket\.h/,/sys\/socket.*h is required/d' configure.ac
        sed -i '/AC_CHECK_HEADERS(\[unistd\.h/,/unistd.*h is required/d' configure.ac

        # 2. 添加 Windows 检测，强制跳过所有 POSIX 依赖
        cat <<'EOF' >> configure.ac

        # === Windows/MinGW 特殊处理 ===
        AS_CASE([$host],
          [*-mingw*], [
            AC_DEFINE([_WIN32_WINNT], [0x0600], [Enable Windows NT 6+ APIs])
            AC_DEFINE([WIN32], [1], [Building for Windows])
            AC_DEFINE([HAVE_ARPA_INET_H], [0], [No arpa/inet.h on Windows])
            AC_DEFINE([HAVE_NETINET_IN_H], [0], [No netinet/in.h])
            AC_DEFINE([HAVE_SYS_SOCKET_H], [0], [No sys/socket.h])
            AC_DEFINE([HAVE_UNISTD_H], [0], [No unistd.h])
            AC_DEFINE([HAVE_NANOSLEEP], [1], [We provide our own])
          ])
        EOF

        # 3. 禁用 gettext（NLS）
        sed -i '/AM_GNU_GETTEXT/d' configure.ac
        sed -i 's|po/Makefile.in po||g' configure.ac
        sed -i '/AM_INIT_AUTOMAKE/a LT_INIT' configure.ac

        # 4. 创建最简 Makefile.am
        mkdir -p m4 src
        cat > Makefile.am <<'EOF'
        AUTOMAKE_OPTIONS = foreign
        ACLOCAL_AMFLAGS = -I m4
        SUBDIRS = src
        EOF

        # 5. Windows 兼容头 + nanosleep stub
        cat > src/compat-win32.h <<'EOF'
        #ifndef COMPAT_WIN32_H
        #define COMPAT_WIN32_H
        #ifdef _WIN32
        #define _WIN32_WINNT 0x0600
        #include <winsock2.h>
        #include <ws2tcpip.h>
        #include <windows.h>
        typedef SOCKET axel_socket_t;
        #define SHUT_RDWR SD_BOTH
        #define EINPROGRESS WSAEWOULDBLOCK
        #define closesocket(s) closesocket(s)
        #define SOCK_ISINVALID(s) ((s) == INVALID_SOCKET)
        int nanosleep(const struct timespec *req, struct timespec *rem);
        #endif
        #endif
        EOF

        cat > src/nanosleep.c <<'EOF'
        #ifdef _WIN32
        #include <windows.h>
        int nanosleep(const struct timespec *req, struct timespec *rem)
        {
            (void)rem;
            DWORD ms = req->tv_sec * 1000 + req->tv_nsec / 1000000;
            Sleep(ms ? ms : 1);
            return 0;
        }
        #endif
        EOF

        # 6. 简单 patch 源码（只改最关键的几处）
        sed -i '1i #include "compat-win32.h"' src/axel.h
        sed -i 's/int fd;/axel_socket_t fd;/g' src/tcp.h
        sed -i 's/int fd;/axel_socket_t fd;/g' src/*.c
        sed -i 's/close(fd)/closesocket(fd)/g' src/*.c
        sed -i 's/read(/recv(/g' src/*.c
        sed -i 's/write(/send(/g' src/*.c

        # Winsock 初始化
        sed -i '/int main(/a\
        #ifdef _WIN32\
        WSADATA wsa; if (WSAStartup(MAKEWORD(2,2), &wsa)) return 1;\
        #endif' src/text.c
        sed -i '/return .*;/i\
        #ifdef _WIN32\
        WSACleanup();\
        #endif' src/text.c

        # 7. Makefile.am
        echo "bin_PROGRAMS = axel" > src/Makefile.am
        echo "axel_SOURCES = $(ls src/*.c | tr '\n' ' ')" >> src/Makefile.am
        echo "axel_SOURCES += nanosleep.c" >> src/Makefile.am
        echo "axel_CFLAGS = -DWIN32 -I." >> src/Makefile.am
        echo "axel_LDFLAGS = -all-static" >> src/Makefile.am
        echo "axel_LDADD = -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lz" >> src/Makefile.am

        autoreconf -fi

    - name: Configure & Build (100% Static)
      shell: msys2 {0}
      run: |
        cd axel-src
        export PKG_CONFIGzens="pkgconf --static"
        export CFLAGS="-O3 -march=x86-64-v3 -flto -pipe"
        export LDFLAGS="-static -static-libgcc -static-libstdc++"

        ./configure --host=x86_64-w64-mingw32 --disable-nls --with-ssl

        make -j$(nproc)
        strip axel.exe
        upx --best --lzma axel.exe

        echo "=== Build Success ==="
        ls -lh axel.exe
        file axel.exe
        ./axel.exe --version

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-x64-static
        path: axel-src/axel.exe
