name: Build Axel (Windows Static) with HTTPS Support

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          mingw-w64 \
          automake \
          libtool \
          gettext \
          autopoint \
          pkg-config \
          make \
          autoconf-archive \
          txt2man \
          python3

    - name: Build and Install Autoconf 2.72
      run: |
        wget -q https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
        tar -xf autoconf-2.72.tar.xz
        cd autoconf-2.72
        ./configure --prefix=/usr/local
        make -j$(nproc)
        sudo make install
        autoconf --version

    - name: Clone axel source
      run: |
        git clone https://github.com/axel-download-accelerator/axel.git
        cd axel
        git submodule update --init --recursive

    - name: Apply Windows compatibility fixes
      run: |
        cd axel
        cat > apply_fixes.py << 'PYEOF'
        import re
        import os
        import stat

        # 1. 修复 src/axel.h
        with open("src/axel.h", "r") as f:
            h = f.read()
        h = h.replace("#include <net/if.h>", "/* #include <net/if.h> */")
        
        win32_inc = """
        #ifdef __MINGW32__
        #include <stdint.h>
        #include <ws2tcpip.h>
        #include <winsock2.h>
        #ifndef sa_family_t
        #define sa_family_t ADDRESS_FAMILY
        #endif
        #ifndef _SSIZE_T_DEFINED
        typedef intptr_t ssize_t;
        #define _SSIZE_T_DEFINED
        #endif
        #endif
        """
        h = h.replace("#include <sys/time.h>", f"#include <sys/time.h>\n{win32_inc}")
        
        minmax_undef = "\n#ifdef min\n#undef min\n#endif\n#ifdef max\n#undef max\n#endif\n"
        h = h.replace('#include "search.h"', f'#include "search.h"\n{minmax_undef}')
        with open("src/axel.h", "w") as f: f.write(h)

        # 2. 创建 src/win32_net.h
        win32_net = """#ifndef WIN32_NET_H
        #define WIN32_NET_H

        #ifdef __MINGW32__
        #include <winsock2.h>
        #include <ws2tcpip.h>
        #include <errno.h>
        #include <limits.h>

        static inline int ws2errno(int ws_err) {
            switch(ws_err) {
                case WSAEWOULDBLOCK:  return EAGAIN;
                case WSAEINPROGRESS:  return EINPROGRESS;
                case WSAEALREADY:     return EALREADY;
                case WSAEISCONN:      return 0;
                case WSAECONNREFUSED: return ECONNREFUSED;
                case WSAETIMEDOUT:    return ETIMEDOUT;
                case WSAECONNRESET:   return ECONNRESET;
                case WSAENETUNREACH:  return ENETUNREACH;
                case WSAEHOSTUNREACH: return EHOSTUNREACH;
                case WSAEADDRINUSE:   return EADDRINUSE;
                default:              return EIO;
            }
        }

        static inline void winsock_init_once(void) {
            static volatile LONG init = 0;
            if (InterlockedCompareExchange(&init, 1, 0) == 0) {
                WSADATA wsaData;
                WSAStartup(MAKEWORD(2,2), &wsaData);
            }
        }

        static inline int win_read(int fd, void *buf, size_t len) {
            winsock_init_once();
            if (len > INT_MAX) len = INT_MAX;
            int ret = recv((SOCKET)fd, (char*)buf, (int)len, 0);
            if (ret == SOCKET_ERROR) { errno = ws2errno(WSAGetLastError()); return -1; }
            return ret;
        }

        static inline int win_write(int fd, const void *buf, size_t len) {
            winsock_init_once();
            if (len > INT_MAX) len = INT_MAX;
            int ret = send((SOCKET)fd, (const char*)buf, (int)len, 0);
            if (ret == SOCKET_ERROR) { errno = ws2errno(WSAGetLastError()); return -1; }
            return ret;
        }

        static inline int win_connect(int fd, const struct sockaddr *name, int namelen) {
            winsock_init_once();
            int ret = connect((SOCKET)fd, name, namelen);
            if (ret == SOCKET_ERROR) {
                int err = WSAGetLastError();
                if (err == WSAEWOULDBLOCK || err == WSAEINPROGRESS || err == WSAEALREADY)
                    errno = EINPROGRESS;
                else if (err == WSAEISCONN)
                    return 0;
                else
                    errno = ws2errno(err);
                return -1;
            }
            return ret;
        }

        static inline int win_close(int fd) { return closesocket((SOCKET)fd); }

        static inline int win_set_timeout(int fd, int optname, int sec) {
            DWORD tout = sec * 1000;
            return setsockopt((SOCKET)fd, SOL_SOCKET, optname, (const char*)&tout, sizeof(tout));
        }

        #define WIN32_NET_READ(fd, buf, len)   win_read((fd), (buf), (len))
        #define WIN32_NET_WRITE(fd, buf, len)  win_write((fd), (buf), (len))
        #define WIN32_NET_CONNECT(fd, name, namelen) win_connect((fd), (name), (namelen))
        #define WIN32_NET_CLOSE(fd)            win_close(fd)
        #else
        #define WIN32_NET_READ(fd, buf, len)   read((fd), (buf), (len))
        #define WIN32_NET_WRITE(fd, buf, len)  write((fd), (buf), (len))
        #define WIN32_NET_CONNECT(fd, name, namelen) connect((fd), (name), (namelen))
        #define WIN32_NET_CLOSE(fd)            close(fd)
        #endif
        #endif
        """
        with open("src/win32_net.h", "w") as f: f.write(win32_net)

        # 3. 注入头文件 & 替换网络调用
        for fname in ["src/tcp.c", "src/conn.c", "src/http.c", "src/ftp.c"]:
            if not os.path.exists(fname): continue
            with open(fname, "r") as f: c = f.read()
            if '#include "win32_net.h"' not in c:
                c = c.replace('#include "axel.h"', '#include "axel.h"\n#include "win32_net.h"')
            c = re.sub(r'\bread\s*\(', 'WIN32_NET_READ(', c)
            c = re.sub(r'\bwrite\s*\(', 'WIN32_NET_WRITE(', c)
            c = re.sub(r'\bconnect\s*\(', 'WIN32_NET_CONNECT(', c)
            c = re.sub(r'\bclose\s*\(', 'WIN32_NET_CLOSE(', c)
            with open(fname, "w") as f: f.write(c)

        # 4. 修复格式字符串 %jd -> %lld
        for fname in ["src/axel.c", "src/http.c", "src/conn.c"]:
            if not os.path.exists(fname): continue
            with open(fname, "r") as f: c = f.read()
            c = re.sub(r'%jd', '%lld', c)
            with open(fname, "w") as f: f.write(c)

        # 5. 修复 tcp.c 平台差异
        with open("src/tcp.c", "r") as f: c = f.read()
        c = re.sub(r'\s*fcntl\s*\(.*F_SETFL.*\);', '', c)
        c = re.sub(
            r'struct timeval tout.*?setsockopt\(.*SO_RCVTIMEO.*?\);.*?setsockopt\(.*SO_SNDTIMEO.*?\);',
            """#ifdef __MINGW32__
                if (io_timeout > 0) {
                    win_set_timeout(sock_fd, SO_RCVTIMEO, io_timeout);
                    win_set_timeout(sock_fd, SO_SNDTIMEO, io_timeout);
                }
            #else
                if (io_timeout > 0) {
                    struct timeval tout = { .tv_sec = io_timeout, .tv_usec = 0 };
                    setsockopt(sock_fd, SOL_SOCKET, SO_RCVTIMEO, &tout, sizeof(tout));
                    setsockopt(sock_fd, SOL_SOCKET, SO_SNDTIMEO, &tout, sizeof(tout));
                }
            #endif""",
            c, flags=re.DOTALL
        )
        c = re.sub(r'\nint\s+get_if_ip\s*\(.*?\)\s*{.*?}\s*', '', c, flags=re.DOTALL)
        c = re.sub(
            r'inline static void\s+tcp_error\s*\(.*?\)\s*{.*?}',
            """#ifdef __MINGW32__
            static void tcp_error(char *hostname, int port, const char *reason) {
                int err = WSAGetLastError();
                fprintf(stderr, "Unable to connect to server %s:%i: Winsock error %d (%s)\\n", hostname, port, err, reason);
            }
            #else
            inline static void tcp_error(char *hostname, int port, const char *reason) {
                fprintf(stderr, _("Unable to connect to server %s:%i: %s\\n"), hostname, port, reason);
            }
            #endif""",
            c, flags=re.DOTALL
        )
        with open("src/tcp.c", "w") as f: f.write(c)

        # 6. 安全替换 Stub 函数（使用括号匹配，绝不破坏原文件结构）
        def safe_replace_func(content, func_name, ret_val):
            for prefix in ["static int ", "int "]:
                start = content.find(f"{prefix}{func_name}(void)")
                if start == -1: continue
                brace = content.find("{", start)
                if brace == -1: continue
                depth = 0
                for i in range(brace, len(content)):
                    if content[i] == "{": depth += 1
                    elif content[i] == "}":
                        depth -= 1
                        if depth == 0:
                            new_body = f"static int {func_name}(void) {{ return {ret_val}; }}"
                            return content[:start] + new_body + content[i+1:]
            return content

        for fname, func, val in [("src/text.c", "get_term_width", "80"), ("src/random.c", "axel_rnd_init", "0")]:
            if os.path.exists(fname):
                with open(fname, "r") as f: c = f.read()
                c = safe_replace_func(c, func, val)
                with open(fname, "w") as f: f.write(c)

        # 7. 启用 CA 证书自动搜索
        if os.path.exists("src/axel.c"):
            with open("src/axel.c", "r") as f: c = f.read()
            if "SSL_CTX_set_default_verify_paths" not in c:
                c = c.replace("SSL_CTX_new(", "SSL_CTX_set_default_verify_paths(ssl_ctx); SSL_CTX_new(")
                with open("src/axel.c", "w") as f: f.write(c)

        print("✅ All patches applied successfully via Python.")
        PYEOF
        python3 apply_fixes.py

    - name: Prepare build environment
      run: |
        echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
        echo "AR=x86_64-w64-mingw32-ar" >> $GITHUB_ENV
        echo "RANLIB=x86_64-w64-mingw32-ranlib" >> $GITHUB_ENV
        echo "STRIP=x86_64-w64-mingw32-strip" >> $GITHUB_ENV

        mkdir -p fake-headers/{netinet,arpa,net,linux,sys}
        for h in in.h in_systm.h ip.h tcp.h if_ether.h; do
          printf "#ifndef _FAKE_H\n#define _FAKE_H\n#include <winsock2.h>\n#endif\n" > fake-headers/netinet/$h
        done
        printf "#ifndef _FAKE_H\n#define _FAKE_H\n#include <winsock2.h>\n#endif\n" > fake-headers/arpa/inet.h
        touch fake-headers/net/if.h fake-headers/net/if_arp.h fake-headers/linux/if_ether.h
        printf "#ifndef _FAKE_H\n#define _FAKE_H\n#include <winsock2.h>\ntypedef int socklen_t;\n#endif\n" > fake-headers/sys/socket.h
        printf "#ifndef _FAKE_H\n#define _FAKE_H\n#endif\n" > fake-headers/sys/ioctl.h fake-headers/sys/time.h fake-headers/netdb.h

        echo "CFLAGS=-O2 -static -D__USE_MINGW_ANSI_STDIO=1 -DO_NONBLOCK=0x4000 -I$(pwd)/fake-headers -ffunction-sections -fdata-sections -Wno-error=format -Wno-error" >> $GITHUB_ENV
        echo "LDFLAGS=-static -static-libgcc -static-libstdc++ -Wl,--gc-sections" >> $GITHUB_ENV

    - name: Generate configure script
      run: |
        cd axel
        mkdir -p m4 build-aux
        autoreconf -fi

    - name: Cross compile OpenSSL for Windows
      run: |
        INSTALL_PATH=$(pwd)/openssl-mingw
        mkdir -p "$INSTALL_PATH"
        wget -q https://github.com/openssl/openssl/releases/download/openssl-3.2.4/openssl-3.2.4.tar.gz
        tar xzf openssl-3.2.4.tar.gz
        cd openssl-3.2.4
        
        ./Configure -static \
          --prefix="$INSTALL_PATH" \
          --libdir=lib \
          --openssldir=ssl \
          mingw64 no-shared \
          enable-tls1_2 enable-tls1_3 enable-ec_nistp_64_gcc_128 \
          no-quic no-err no-dso no-engine no-async no-dtls no-sctp \
          no-ssl3 no-tls1 no-tls1_1 no-comp no-docs no-tests no-apps \
          -O2 -ffunction-sections -fdata-sections
          
        make -j$(nproc)
        make install_sw
        
        cd "$INSTALL_PATH/lib"
        cat > libcrypto.pc << PC
        prefix=$INSTALL_PATH
        exec_prefix=\${prefix}
        libdir=\${exec_prefix}/lib
        includedir=\${prefix}/include
        Name: OpenSSL-libcrypto
        Description: OpenSSL cryptography library
        Version: 3.2.4
        Libs: -L\${libdir} -lcrypto -lws2_32 -lgdi32 -lcrypt32 -ladvapi32 -lbcrypt
        Cflags: -I\${includedir}
        PC
        cat > libssl.pc << PC
        prefix=$INSTALL_PATH
        exec_prefix=\${prefix}
        libdir=\${exec_prefix}/lib
        includedir=\${prefix}/include
        Name: OpenSSL
        Description: SSL/TLS library
        Version: 3.2.4
        Requires.private: libcrypto
        Libs: -L\${libdir} -lssl
        Cflags: -I\${includedir}
        PC

    - name: Configure
      run: |
        cd axel
        export PKG_CONFIG_PATH=$(pwd)/../openssl-mingw/lib
        ./configure \
          --host=x86_64-w64-mingw32 \
          --disable-nls \
          --disable-dependency-tracking \
          --with-ssl=openssl \
          ac_cv_header_arpa_inet_h=yes \
          ac_cv_header_netdb_h=yes \
          ac_cv_header_netinet_in_h=yes \
          ac_cv_header_sys_socket_h=yes \
          ac_cv_func_nanosleep=yes \
          ac_cv_func_gettimeofday=yes \
          LIBS="-lws2_32 -lcrypt32 -ladvapi32 -lgdi32 -lbcrypt"

    - name: Build
      run: |
        cd axel
        make -j$(nproc) V=1

    - name: Strip and verify
      run: |
        cd axel
        x86_64-w64-mingw32-strip --strip-all axel.exe
        file axel.exe
        ls -lh axel.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-static-ssl
        path: axel/axel.exe
        retention-days: 30
