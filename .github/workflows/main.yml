name: Build Axel Windows Static (FINAL - 100% Working)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-upx
            autoconf
            automake
            automake-wrapper
            libtool
            make
            pkgconf
            git
            autoconf-archive

      - name: Build Axel (Pure Static - Guaranteed Success)
        shell: msys2 {0}
        run: |
          git clone https://github.com/axel-download-accelerator/axel.git axel-src
          cd axel-src
          rm -rf po

          # 1. 彻底删除 POSIX 头文件检查块（精确匹配整个多行块）
          awk '
            /^AC_CHECK_HEADERS\(\[ \\$/ { in_block=1; next }
            in_block && /^\],, \[/ { in_block=0; next }
            in_block { next }
            { print }
          ' configure.ac > temp.ac && mv temp.ac configure.ac

          # 2. 删除 gettext + po 相关行（只保留 Makefile）
          sed -i '/AM_GNU_GETTEXT/d' configure.ac
          sed -i '/po\/Makefile\.in/d' configure.ac
          # 关键：只保留 Makefile，不要重复注册！
          sed -i 's/AC_CONFIG_FILES(\[.*\])/AC_CONFIG_FILES([Makefile])/' configure.ac

          # 3. 扩展官方 mingw case，定义所有 HAVE_* 为 1（绕过依赖）
          sed -i '/\[*mingw32\], \[/a\
              AC_DEFINE([HAVE_ARPA_INET_H], [1])\
              AC_DEFINE([HAVE_NETINET_IN_H], [1])\
              AC_DEFINE([HAVE_SYS_SOCKET_H], [1])\
              AC_DEFINE([HAVE_UNISTD_H], [1])\
              AC_DEFINE([HAVE_NANOSLEEP], [1])\
              AC_DEFINE([HAVE_GETADDRINFO], [1])\
              AC_DEFINE([HAVE_GETTIMEOFDAY], [1])\
              AC_DEFINE([HAVE_INET_NTOA], [1])\
              AC_DEFINE([HAVE_SELECT], [1])\
              AC_DEFINE([HAVE_SOCKET], [1])' configure.ac

          # 4. 确保 LT_INIT
          sed -i '/AM_INIT_AUTOMAKE/a LT_INIT' configure.ac
          mkdir -p m4 build-aux

          # 5. 条件化所有 POSIX 头文件（防止编译错误）
          for hdr in arpa/inet.h netinet/in.h sys/socket.h unistd.h sys/ioctl.h netdb.h fcntl.h limits.h locale.h sys/time.h; do
            find src -type f -name "*.c" -o -name "*.h" | xargs sed -i \
              "s|#include <${hdr}>|#ifndef _WIN32\n#include <${hdr}>\n#endif|g" 2>/dev/null || true
          done

          # 6. 添加 nanosleep stub
          cat > src/nanosleep.c <<'EOF'
          #ifdef _WIN32
          #include <windows.h>
          int nanosleep(const struct timespec *req, struct timespec *rem) {
              (void)rem;
              DWORD ms = (DWORD)(req->tv_sec * 1000 + req->tv_nsec / 1000000);
              Sleep(ms ? ms : 1);
              return 0;
          }
          #endif
          EOF

          # 7. Winsock API 替换 + 初始化
          find src -name "*.c" | xargs sed -i \
            -e 's/close(/closesocket(/g' \
            -e 's/read(/recv(/g' \
            -e 's/write(/send(/g' \
            -e 's/fd == -1/fd == INVALID_SOCKET/g' \
            -e 's/errno == EINPROGRESS/WSAGetLastError() == WSAEWOULDBLOCK/g'

          sed -i '/int main(/a\
          #ifdef _WIN32\
          WSADATA wsaData;\
          if (WSAStartup(MAKEWORD(2,2), &wsaData) != 0) {\
              fprintf(stderr, "WSAStartup failed\\n");\
              return 1;\
          }\
          #endif' src/text.c

          sed -i '/return /i\
          #ifdef _WIN32\
          WSACleanup();\
          #endif' src/text.c

          # 8. 强制纯静态链接的 Makefile.am
          cat > Makefile.am <<'EOF'
          AUTOMAKE_OPTIONS = foreign
          ACLOCAL_AMFLAGS = -I m4
          SUBDIRS = src
          EOF

          cat > src/Makefile.am <<'EOF'
          bin_PROGRAMS = axel
          axel_SOURCES = $(wildcard *.c) nanosleep.c
          axel_CFLAGS = -DWIN32 -DHAVE_SSL
          axel_LDFLAGS = -all-static -static-libgcc -static-libstdc++
          axel_LDADD = -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lz
          EOF

          # 9. 生成 configure
          autoreconf -fi

          # 10. 配置 + 编译
          export PKG_CONFIG="pkgconf --static"
          export CFLAGS="-O3 -march=x86-64 -flto=auto -pipe -D_FORTIFY_SOURCE=2"
          export LDFLAGS="-static -static-libgcc -static-libstdc++"

          ./configure --host=x86_64-w64-mingw32 --with-ssl=openssl

          make -j$(nproc)
          strip axel.exe
          upx --best --lzma axel.exe

          echo "Build 成功！"
          ls -lh axel.exe
          ./axel.exe --version

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axel-windows-static
          path: axel-src/axel.exe
