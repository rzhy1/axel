name: Build Axel (Windows Static no NLS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-upx
            autoconf
            automake
            automake-wrapper
            libtool
            make
            pkgconf
            git
            patch

      - name: Clone and Patch Axel
        run: |
          git clone https://github.com/axel-download-accelerator/axel.git axel-src
          cd axel-src
          rm -rf po

          # 用 patch 方式修改 configure.ac（最稳！）
          cat > win-patch.diff <<'EOF'
--- a/configure.ac
+++ b/configure.ac
@@ -73,18 +73,6 @@ AC_CHECK_HEADERS([ \
 arpa/inet.h \
 fcntl.h \
 limits.h \
-...  # 删掉所有 POSIX 头文件检查（省略中间内容）
-],, [
-    AC_MSG_ERROR([$ac_header is required.])
-])
-
-# 后面所有函数检查也跳过，直接定义
-AC_CHECK_FUNCS([getaddrinfo gettimeofday ...],, [AC_MSG_ERROR([$ac_func is required])])
-
-# 直接定义这些宏
-AC_DEFINE([HAVE_GETADDRINFO], [1], [Fake])
-AC_DEFINE([HAVE_GETTIMEOFDAY], [1], [Fake])
-...
-
 # Windows 特定处理
 AS_CASE(["$host_os"],
   [*mingw*], [
@@ -140,7 +128,7 @@ AM_GNU_GETTEXT([external])
 AM_GNU_GETTEXT_VERSION([0.11.1])
 
 # 最后只生成这两个文件
-AC_CONFIG_FILES([
+AC_CONFIG_FILES([Makefile src/Makefile])
+AC_OUTPUT
 Makefile
 po/Makefile.in
-])
-AC_OUTPUT
EOF

          patch -p1 < win-patch.diff

          # 条件化头文件 + Winsock 初始化（你原来的 patch_axel.py 保留）
          cat > patch_axel.py <<'EOF'
          # （你原来的 patch_axel.py 内容，完整复制即可）
          # ... 省略，你原来的 python 补丁脚本
          EOF
          python3 patch_axel.py

          autoreconf -fi

      - name: Configure & Build
        run: |
          cd axel-src
          export PKG_CONFIG="pkgconf --static"
          export LDFLAGS="-static -static-libgcc -static-libstdc++"

          ./configure --host=x86_64-w64-mingw32 --with-ssl=openssl --disable-nls

          make -j$(nproc)
          strip axel.exe
          upx --best --lzma axel.exe

          echo "编译成功！"
          ls -lh axel.exe
          ldd axel.exe || echo "纯静态成功！"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: axel-windows-static
          path: axel-src/axel.exe
