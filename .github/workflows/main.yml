name: Build Axel Windows Static (Fixed AC_CHECK_HEADERS Block)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-upx
            autoconf
            automake
            automake-wrapper
            libtool
            make
            pkgconf
            git
            autoconf-archive

      - name: Build Pure Static Axel (Precise Fix for configure.ac)
        shell: msys2 {0}
        run: |
          git clone https://github.com/axel-download-accelerator/axel.git axel-src
          cd axel-src
          rm -rf po

          # 1. 精确删除整个 AC_CHECK_HEADERS 块（从 AC_CHECK_HEADERS([ \ 到 ],, [AC_MSG_ERROR...])）
          awk '
          /AC_CHECK_HEADERS\(\[ \\$/ { in_block = 1; next }
          in_block && /],, \[/ { in_block = 0; next }
          in_block { next }
          { print }
          END { if (in_block) print "Warning: Block not closed" }
          ' configure.ac > temp.ac && mv temp.ac configure.ac

          # 2. 删除 po/Makefile.in 和 AM_GNU_GETTEXT
          sed -i '/AM_GNU_GETTEXT/d' configure.ac
          sed -i '/po\/Makefile.in/d' configure.ac
          sed -i 's/AC_CONFIG_FILES(\[/AC_CONFIG_FILES([\nMakefile\n/' configure.ac

          # 3. 扩展官方 mingw case（第 49 行左右），定义所有 HAVE_* 宏为 1（绕过后续依赖）
          sed -i '/\[*mingw32\], \[/a\
              AC_DEFINE([HAVE_ARPA_INET_H], [1])\
              AC_DEFINE([HAVE_FCNTL_H], [1])\
              AC_DEFINE([HAVE_LIMITS_H], [1])\
              AC_DEFINE([HAVE_LOCALE_H], [1])\
              AC_DEFINE([HAVE_NETDB_H], [1])\
              AC_DEFINE([HAVE_NETINET_IN_H], [1])\
              AC_DEFINE([HAVE_STDLIB_H], [1])\
              AC_DEFINE([HAVE_SYS_IOCTL_H], [1])\
              AC_DEFINE([HAVE_SYS_SOCKET_H], [1])\
              AC_DEFINE([HAVE_SYS_TIME_H], [1])\
              AC_DEFINE([HAVE_UNISTD_H], [1])\
              AC_DEFINE([HAVE_NANOSLEEP], [1])' configure.ac

          # 4. LT_INIT + m4
          sed -i '/AM_INIT_AUTOMAKE/a LT_INIT' configure.ac
          mkdir -p m4

          # 5. 条件化所有 POSIX 头文件（防止编译时包含缺失头）
          for hdr in arpa/inet.h netinet/in.h sys/socket.h unistd.h sys/ioctl.h netdb.h fcntl.h limits.h locale.h sys/time.h; do
            find src -name "*.c" -o -name "*.h" | xargs sed -i "s/#include <${hdr}>/#ifndef _WIN32\n#include <${hdr}>\n#endif/g"
          done

          # 6. nanosleep stub（官方 AC_CHECK_FUNCS 会检查，但我们定义 HAVE_NANOSLEEP=1 绕过）
          cat > src/nanosleep.c <<'EOF'
          #ifdef _WIN32
          #include <windows.h>
          int nanosleep(const struct timespec *req, struct timespec *rem) {
              (void)rem;
              DWORD ms = (DWORD)(req->tv_sec * 1000 + req->tv_nsec / 1000000);
              Sleep(ms ? ms : 1);
              return 0;
          }
          #endif
          EOF

          # 7. Winsock API 替换
          sed -i 's/close(/closesocket(/g' src/*.c
          sed -i 's/read(/recv(/g' src/*.c
          sed -i 's/write(/send(/g' src/*.c
          sed -i 's/fd == -1/fd == INVALID_SOCKET/g' src/*.c
          sed -i 's/errno == EINPROGRESS/WSAGetLastError() == WSAEWOULDBLOCK/g' src/*.c

          # Winsock init/cleanup in main
          sed -i '/int main(/a #ifdef _WIN32\nWSADATA wsaData; if (WSAStartup(MAKEWORD(2,2), &wsaData) != 0) { fprintf(stderr, "WSAStartup failed\\n"); return 1; }\n#endif' src/text.c
          sed -i '/return /i #ifdef _WIN32\nWSACleanup();\n#endif' src/text.c

          # 8. Makefile.am（纯静态）
          cat > Makefile.am <<'EOF'
          AUTOMAKE_OPTIONS = foreign
          ACLOCAL_AMFLAGS = -I m4
          SUBDIRS = src
          EOF

          cat > src/Makefile.am <<'EOF'
          bin_PROGRAMS = axel
          axel_SOURCES = $(wildcard *.c) nanosleep.c
          axel_CFLAGS = -DWIN32 -DHAVE_SSL
          axel_LDFLAGS = -all-static -static-libgcc -static-libstdc++
          axel_LDADD = -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lz -lbcrypt
          EOF

          # 9. autoreconf
          autoreconf -fi

          # 10. 配置 & 构建
          export PKG_CONFIG="pkgconf --static"
          export CFLAGS="-O3 -march=x86-64 -flto=auto -pipe -D_FORTIFY_SOURCE=2"
          export LDFLAGS="-static -static-libgcc -static-libstdc++ -Wl,--no-undefined"

          ./configure --host=x86_64-w64-mingw32 --with-ssl=openssl --disable-nls

          make -j$(nproc)
          strip axel.exe
          upx --best --lzma axel.exe

          echo "Build success!"
          ls -lh axel.exe
          ./axel.exe --version

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axel-windows-static
          path: axel-src/axel.exe
          retention-days: 7
