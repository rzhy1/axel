name: Build Super Downloader (Windows EXE)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies for cross-compilation
      run: |
        sudo apt update
        sudo apt install -y git cmake g++-multilib mingw-w64 unzip

    - name: Clone and bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git $HOME/vcpkg
        $HOME/vcpkg/bootstrap-vcpkg.sh

    - name: Install Windows dependencies via vcpkg
      run: |
        $HOME/vcpkg/vcpkg install openssl:x64-windows curl:x64-windows
        $HOME/vcpkg/vcpkg integrate install

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake (cross compile Windows exe)
      run: |
        cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Windows exe
      uses: actions/upload-artifact@v4
      with:
        name: super_downloader
        path: build/Release/*.exe
