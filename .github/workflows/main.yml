name: Build Axel Windows Static - FINAL WORKING

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-upx
            autoconf
            automake
            automake-wrapper
            libtool
            make
            pkgconf
            git
            autoconf-archive

      - name: Build Axel Pure Static
        shell: msys2 {0}
        run: |
          git clone https://github.com/axel-download-accelerator/axel.git axel-src
          cd axel-src
          rm -rf po

          sed -i '/AC_CHECK_HEADERS(\[ \\$/,/AC_MSG_ERROR.*required/d' configure.ac
          sed -i '/AM_GNU_GETTEXT/d' configure.ac
          sed -i '/po\/Makefile\.in/d' configure.ac
          sed -i '/AC_CONFIG_FILES/,$d' configure.ac

          cat >> configure.ac <<'EOF'
AC_CONFIG_FILES([Makefile src/Makefile])
AC_OUTPUT
EOF

          sed -i '/\[*mingw32\], \[/a\
              AC_DEFINE([HAVE_ARPA_INET_H], [1], [Fake for Windows])\
              AC_DEFINE([HAVE_NETINET_IN_H], [1], [Fake for Windows])\
              AC_DEFINE([HAVE_SYS_SOCKET_H], [1], [Fake for Windows])\
              AC_DEFINE([HAVE_UNISTD_H], [1], [Fake for Windows])\
              AC_DEFINE([HAVE_NANOSLEEP], [1], [Fake for Windows])' configure.ac

          sed -i '/AM_INIT_AUTOMAKE/a LT_INIT' configure.ac
          mkdir -p m4 build-aux

          for h in arpa/inet.h netinet/in.h sys/socket.h unistd.h; do
            find src -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
              "s|#include <${h}>|#ifndef _WIN32\n#include <${h}>\n#endif|g" {} +
          done

          cat > src/nanosleep.c <<'EOF'
#ifdef _WIN32
#include <windows.h>
int nanosleep(const struct timespec *req, struct timespec *rem) {
    (void)rem; Sleep((DWORD)((req->tv_sec*1000) + (req->tv_nsec/1000000))); return 0;
}
#endif
EOF

          find src -name "*.c" -exec sed -i \
            -e 's/close(/closesocket(/g' \
            -e 's/read(/recv(/g' \
            -e 's/write(/send(/g' {} +

          sed -i '/int main(/a\
#ifdef _WIN32\nWSADATA wsaData; if(WSAStartup(MAKEWORD(2,2),&wsaData)!=0)return 1;\n#endif' src/text.c
          sed -i '/return /i\
#ifdef _WIN32\nWSACleanup();\n#endif' src/text.c

          cat > Makefile.am <<'EOF'
AUTOMAKE_OPTIONS = foreign
ACLOCAL_AMFLAGS = -I m4
SUBDIRS = src
EOF

          cat > src/Makefile.am <<'EOF'
bin_PROGRAMS = axel
axel_SOURCES = $(wildcard *.c) nanosleep.c
axel_CFLAGS = -DWIN32 -DHAVE_SSL
axel_LDFLAGS = -all-static
axel_LDADD = -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lz
EOF

          autoreconf -fi

          export PKG_CONFIG="pkgconf --static"
          export LDFLAGS="-static -static-libgcc -static-libstdc++"

          ./configure --host=x86_64-w64-mingw32 --with-ssl=openssl --disable-nls

          make -j$(nproc)
          strip axel.exe
          upx --best --lzma axel.exe

          echo "编译成功"
          ls -lh axel.exe
          ./axel.exe --version

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axel-windows-static
          path: axel-src/axel.exe
