name: Build Axel Windows Static

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: git base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-openssl mingw-w64-x86_64-upx autoconf automake libtool pkgconf

      - name: Build
        run: |
          git clone https://github.com/axel-download-accelerator/axel.git
          cd axel
          rm -rf po

          # 关键 4 行修改（再也不会出错）
          sed -i '/AC_CHECK_HEADERS(\[ \\$/,/AC_MSG_ERROR/d' configure.ac
          sed -i '/AM_GNU_GETTEXT/d' configure.ac
          sed -i '/po/d' configure.ac
          sed -i '/AC_CONFIG_FILES/,/AC_OUTPUT/d' configure.ac
          echo "AC_CONFIG_FILES([Makefile src/Makefile])" >> configure.ac
          echo "AC_OUTPUT" >> configure.ac
          sed -i '/AM_INIT_AUTOMAKE/a LT_INIT' configure.ac

          # 创建必须的目录
          mkdir -p m4 build-aux

          # 创建最简 Makefile.am（解决 po 目录错误）
          cat > Makefile.am <<'EOF'
          AUTOMAKE_OPTIONS = foreign
          ACLOCAL_AMFLAGS = -I m4
          SUBDIRS = src
          EOF

          cat > src/Makefile.am <<'EOF'
          bin_PROGRAMS = axel
          axel_SOURCES = $(wildcard *.c)
          axel_CFLAGS = -DWIN32 -DHAVE_SSL
          axel_LDFLAGS = -all-static
          axel_LDADD = -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lz
          EOF

          # 条件化头文件
          for h in arpa/inet.h netinet/in.h sys/socket.h unistd.h; do
            find src -type f -exec sed -i "s|#include <${h}>|#ifndef _WIN32\n#include <${h}>\n#endif|g" {} \;
          done

          # Winsock 初始化
          sed -i '/int main(/a #ifdef _WIN32\nWSADATA w; if(WSAStartup(MAKEWORD(2,2),&w)!=0)return 1;\n#endif' src/text.c
          sed -i '/return /i #ifdef _WIN32\nWSACleanup();\n#endif' src/text.c

          autoreconf -fi
          export PKG_CONFIG="pkgconf --static"
          ./configure --host=x86_64-w64-mingw32 --with-ssl=openssl --disable-nls
          make -j$(nproc)
          strip src/axel.exe
          upx --best --lzma src/axel.exe

          echo "编译成功！"
          ls -lh src/axel.exe
          ldd src/axel.exe || echo "纯静态成功！"

      - uses: actions/upload-artifact@v4
        with:
          name: axel-windows-static
          path: axel/src/axel.exe
