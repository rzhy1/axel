name: Build Axel (CMake, MinGW static)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 (MINGW64)
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-OpenSSL
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-pkg-config

    - name: Extract patched source (if tar in repo root)
      shell: msys2 {0}
      run: |
        # 如果你是直接把源码放在仓库里可以跳过这步
        if [ -f axel-windows-patched.tar.gz ]; then
          mkdir -p axel-src
          tar -xzf axel-windows-patched.tar.gz -C axel-src --strip-components=1
          cd axel-src
        else
          cd .
        fi
        pwd
        ls -la

    - name: Configure & Build (MINGW64)
      shell: msys2 {0}
      env:
        PKG_CONFIG_PATH: /mingw64/lib/pkgconfig
      run: |
        # 进入源码根（确保 CMakeLists.txt 在仓库根或在 axel-src 下）
        if [ -d axel-src ]; then
          cd axel-src
        fi

        mkdir -p build && cd build

        # 使用 MinGW Makefiles 生成器
        cmake -G "MinGW Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_STATIC=ON \
          -DENABLE_SSL=ON \
          -DCMAKE_MAKE_PROGRAM=/usr/bin/make \
          ..

        cmake --build . --config Release -- -j$(nproc)

        # 输出文件信息
        file src/axel.exe || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: axel-windows-static-cmake
        path: |
          axel-src/build/src/axel.exe
