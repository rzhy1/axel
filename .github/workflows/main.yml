name: Build Axel Static

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        msystem: MINGW64 # 关键：锁定为MINGW64环境

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 and MINGW64 toolchain
      run: |
        pacman -Syu --noconfirm
        pacman -S --needed --noconfirm \
          mingw-w64-x86_64-toolchain \
          autoconf-archive \
          mingw-w64-x86_64-openssl \
          autoconf automake libtool pkgconf make

    - name: Download and extract source
      run: |
        curl -L -o axel.tar.xz https://github.com/axel-download-accelerator/axel/releases/download/v2.17.14/axel-2.17.14.tar.xz
        tar -xJf axel.tar.xz
        mv axel-2.17.14 axel-src

    - name: Configure and Build (Static)
      run: |
        cd axel-src
        autoreconf -vfi
        ./configure --host=x86_64-w64-mingw32 --disable-nls --with-ssl=openssl \
          CFLAGS="-O2 -static" \
          LDFLAGS="-static -lssl -lcrypto -lws2_32"
        make -j$(nproc)
        strip src/axel.exe

    - uses: actions/upload-artifact@v4
      with:
        name: axel-static-windows
        path: axel-src/src/axel.exe
