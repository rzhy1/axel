name: Build super_downloader

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest

    steps:
    # Checkout repository
    - name: Checkout repo
      uses: actions/checkout@v4

    # Cache vcpkg installed packages
    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    # Install vcpkg if not exists
    - name: Setup vcpkg
      run: |
        if (-Not (Test-Path "C:\vcpkg")) {
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat
        }

    # Install dependencies via vcpkg (curl + OpenSSL + zlib)
    - name: Install dependencies
      run: |
        C:\vcpkg\vcpkg.exe install curl[core,ssl,non-http]:x64-windows
        C:\vcpkg\vcpkg.exe install openssl:x64-windows
        C:\vcpkg\vcpkg.exe install zlib:x64-windows

    # Configure CMake
    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release

    # Build the project
    - name: Build
      run: cmake --build build --config Release

    # Archive the exe as artifact
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: super_downloader
        path: build/Release/super_downloader.exe
